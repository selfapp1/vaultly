<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Vaultly</title>
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vaultly" />
<meta name="theme-color" content="#0f1115" />
<meta name="format-detection" content="telephone=no" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />

<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root {
    --bg: #0f1115;
    --surface: #171a21;
    --surface-2: #1f2330;
    --border: #2a2f3d;
    --text: #eef0f4;
    --text-dim: #b3b8e2;
    --accent-1: #6366f1;
    --accent-2: #a855f7;
    --danger: #f87171;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  #app { min-height: 100%; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); }
  input, textarea, button { font-family: inherit; }
  ::selection { background: var(--accent-1); color: #fff; }

  .center-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px calc(32px + var(--safe-bottom));
    text-align: center;
  }
  .logo-badge {
    width: 72px; height: 72px; border-radius: 20px;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 18px;
    box-shadow: 0 10px 30px rgba(99,102,241,0.35);
  }
  h1.title { font-size: 22px; margin: 0 0 6px; font-weight: 700; }
  p.subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; line-height: 1.6; }

  .field {
    width: 100%; max-width: 340px; text-align: left; margin-bottom: 14px;
  }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent-1); }

  .btn {
    appearance: none; border: none; cursor: pointer;
    padding: 14px 20px; border-radius: 14px; font-size: 15px; font-weight: 700;
    width: 100%; max-width: 340px; color: #fff;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    box-shadow: 0 8px 20px rgba(99,102,241,0.28);
  }
  .btn:active { transform: scale(0.98); }
  .btn.secondary {
    background: var(--surface-2); color: var(--text); box-shadow: none; border: 1px solid var(--border);
  }
  .btn.ghost { background: transparent; box-shadow: none; color: var(--accent-1); font-weight: 600; padding: 10px; }
  .btn.danger { background: var(--danger); box-shadow: none; }
  .btn-row { display: flex; gap: 10px; width: 100%; max-width: 340px; }
  .btn-row .btn { width: auto; flex: 1; }

  .error-msg { color: var(--danger); font-size: 13px; min-height: 18px; margin: -4px 0 10px; }
  .warn-box {
    max-width: 340px; text-align: left; background: rgba(248,113,113,0.08);
    border: 1px solid rgba(248,113,113,0.35); border-radius: 12px; padding: 12px 14px;
    font-size: 12.5px; color: #f2a4a4; line-height: 1.6; margin-bottom: 20px;
  }

  /* ---- Main screen ---- */
  header.top {
    position: sticky; top: 0; z-index: 5;
    padding: 14px 16px 12px;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
    display: flex; align-items: center; gap: 10px;
  }
  header.top h2 { font-size: 20px; margin: 0; flex: 1; font-weight: 800; }
  .icon-btn {
    width: 38px; height: 38px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); display: flex; align-items: center; justify-content: center;
    font-size: 17px; cursor: pointer;
  }
  .search-wrap { padding: 0 16px 10px; }
  .search-wrap input {
    width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 15px; outline: none;
  }

  main.content { padding: 4px 16px 100px; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 14px; line-height: 1.8; }

  .site-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    margin-bottom: 12px; overflow: hidden;
  }
  .site-head { display: flex; align-items: center; gap: 12px; padding: 14px 14px; cursor: pointer; }
  .avatar {
    width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 16px;
  }
  .site-name-wrap { flex: 1; min-width: 0; }
  .site-name { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-sub { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .chevron { color: var(--text-dim); transition: transform .2s; font-size: 13px; }
  .site-card.open .chevron { transform: rotate(90deg); }

  .site-body { display: none; padding: 0 14px 14px; }
  .site-card.open .site-body { display: block; }

  .field-row {
    display: flex; align-items: center; gap: 10px;
    background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px;
    cursor: pointer; border: 1px solid transparent;
  }
  .field-row:active { border-color: var(--accent-1); }
  .field-row .flabel { font-size: 11px; color: var(--text-dim); font-weight: 700; margin-bottom: 2px; }
  .field-row .fvalue { font-size: 15px; word-break: break-all; }
  .field-row .ftext { flex: 1; min-width: 0; }
  .field-row .feye { color: var(--text-dim); font-size: 16px; padding: 4px; flex-shrink: 0; }
  .field-row .fcopy { color: var(--accent-1); font-size: 16px; padding: 4px; flex-shrink: 0; }

  .memo-box { font-size: 13px; color: var(--text-dim); background: var(--surface-2); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; white-space: pre-wrap; word-break: break-word; }

  .card-actions { display: flex; gap: 8px; margin-top: 4px; }
  .card-actions .btn { padding: 10px; font-size: 13px; }

  .fab {
    position: fixed; right: 20px; bottom: calc(24px + var(--safe-bottom));
    width: 58px; height: 58px; border-radius: 20px; border: none;
    background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
    color: #fff; font-size: 26px; box-shadow: 0 10px 24px rgba(99,102,241,0.4);
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 6;
  }
  .fab:active { transform: scale(0.95); }

  /* ---- Modal / sheet ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 20;
    display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .sheet {
    background: var(--bg); width: 100%; max-height: 92vh; overflow-y: auto;
    border-radius: 22px 22px 0 0; padding: 18px 18px calc(24px + var(--safe-bottom));
    transform: translateY(100%); transition: transform .25s ease;
    border-top: 1px solid var(--border);
  }
  .overlay.show .sheet { transform: translateY(0); }
  .sheet-handle { width: 40px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 14px; }
  .sheet-title { font-size: 18px; font-weight: 800; margin: 0 0 16px; }

  .sfield { margin-bottom: 12px; }
  .sfield label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .sfield-row { display: flex; gap: 8px; align-items: flex-end; }
  .sfield-row .sfield { flex: 1; margin-bottom: 0; }
  .sfield input, .sfield textarea {
    width: 100%; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 15px; outline: none;
  }
  .sfield textarea { resize: vertical; min-height: 60px; }
  .sfield input:focus, .sfield textarea:focus { border-color: var(--accent-1); }
  .field-block {
    background: linear-gradient(160deg, rgba(99,102,241,0.16), rgba(168,85,247,0.06)), var(--surface);
    border: 1px solid rgba(99,102,241,0.3); border-radius: 14px; padding: 12px; margin-bottom: 10px;
  }
  .field-block-top { display: flex; flex-direction: column; gap: 6px; }
  .fLabelInput {
    width: 100%; padding: 7px 10px; border-radius: 8px; border: 1px solid rgba(99,102,241,0.25);
    background: rgba(99,102,241,0.14); color: var(--text-dim); font-size: 12px; font-weight: 700; outline: none;
  }
  .fLabelInput:focus { border-color: var(--accent-1); color: var(--text); }
  .fValueInput {
    width: 100%; padding: 12px 13px; border-radius: 11px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--text); font-size: 15.5px; outline: none;
  }
  .fValueInput:focus { border-color: var(--accent-1); }
  .field-block-actions { display: flex; justify-content: flex-end; margin-top: 8px; }
  .remove-field-btn { color: var(--danger); font-size: 12.5px; font-weight: 700; background: none; border: none; cursor: pointer; }
  .add-field-btn { width: 100%; padding: 11px; border-radius: 11px; border: 1px dashed var(--border); background: none; color: var(--accent-1); font-weight: 700; font-size: 13.5px; cursor: pointer; margin-bottom: 16px; }

  .sheet .btn-row { max-width: none; margin-top: 6px; }
  .sheet .btn { max-width: none; }

  /* toast */
  #toast {
    position: fixed; left: 50%; bottom: calc(30px + var(--safe-bottom)); transform: translateX(-50%) translateY(20px);
    background: #1f2330; color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 13.5px;
    opacity: 0; transition: opacity .2s, transform .2s; z-index: 50; box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    pointer-events: none; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .settings-item {
    display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 13px 14px; margin-bottom: 10px; color: var(--text); font-size: 14.5px; font-weight: 600;
    cursor: pointer;
  }
  .settings-item.danger { color: var(--danger); }
  .autosync-line {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-dim);
    padding: 2px 4px 16px; cursor: pointer;
  }
  .autosync-line input { width: 16px; height: 16px; accent-color: var(--accent-1); flex-shrink: 0; }
  .settings-note { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin: 6px 2px 18px; }
  #importFile, #importFile2 { display: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";

/* ========================= 暗号まわり ========================= */
const enc = new TextEncoder();
const dec = new TextDecoder();

function toB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function deriveKey(password, saltB64, iterations) {
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromB64(saltB64), iterations, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    true,
    ["encrypt", "decrypt"]
  );
}

/* ========================= タブを閉じてもロック解除状態を一定時間保持 ========================= */
/* マスターパスワードを毎回聞かれる煩わしさを減らすため、直近の解除から一定時間はスキップする。
   その間は端末を触れる人なら誰でも中身を見られるので、時間を延ばしすぎないこと。 */
const UNLOCK_CACHE_KEY = "pv_unlock_cache";
const UNLOCK_CACHE_HOURS = 4;

async function cacheKeyForSession(key) {
  try {
    const raw = await crypto.subtle.exportKey("raw", key);
    localStorage.setItem(UNLOCK_CACHE_KEY, JSON.stringify({
      key: toB64(raw),
      expiresAt: Date.now() + UNLOCK_CACHE_HOURS * 3600 * 1000,
    }));
  } catch (e) {
    // キャッシュに失敗しても致命的ではないので無視する
  }
}

function clearSessionKeyCache() {
  localStorage.removeItem(UNLOCK_CACHE_KEY);
}

async function tryAutoUnlock() {
  const raw = localStorage.getItem(UNLOCK_CACHE_KEY);
  const store = loadStore();
  if (!raw || !store) return false;
  try {
    const cached = JSON.parse(raw);
    if (!cached.key || !cached.expiresAt || Date.now() >= cached.expiresAt) {
      clearSessionKeyCache();
      return false;
    }
    const key = await crypto.subtle.importKey("raw", fromB64(cached.key), { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
    const vault = await decryptObj(key, store.iv, store.data);
    state.key = key;
    state.vault = vault;
    return true;
  } catch (e) {
    clearSessionKeyCache();
    return false;
  }
}

async function encryptObj(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = enc.encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
  return { iv: toB64(iv), data: toB64(cipher) };
}

async function decryptObj(key, ivB64, dataB64) {
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: fromB64(ivB64) }, key, fromB64(dataB64)
  );
  return JSON.parse(dec.decode(plain));
}

/* ========================= ストレージ ========================= */
const STORE_KEY = "pv_store_v1";
const ITERATIONS = 250000;

function loadStore() {
  const raw = localStorage.getItem(STORE_KEY);
  return raw ? JSON.parse(raw) : null;
}
function saveStore(store) {
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
}

/* ========================= Googleドライブ連携 ========================= */
const GDRIVE_CLIENT_ID = "151024751905-f74rcgi65ao8149pqrujusjeb7lq5ohv.apps.googleusercontent.com";
const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const GDRIVE_FOLDER_KEY = "pv_gdrive_folder_id";
const GDRIVE_TOKEN_CACHE_KEY = "pv_gdrive_token_cache";
let gdriveTokenClient = null;
let gdriveAccessToken = loadCachedGdriveToken();

/* Googleへの許可情報をタブが閉じるまで保持する(リロードのたびに聞き直さないため) */
function loadCachedGdriveToken() {
  try {
    const raw = sessionStorage.getItem(GDRIVE_TOKEN_CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj.token || !obj.expiresAt || Date.now() >= obj.expiresAt - 60000) return null;
    return obj.token;
  } catch (e) {
    return null;
  }
}
function cacheGdriveToken(token, expiresInSec) {
  try {
    sessionStorage.setItem(GDRIVE_TOKEN_CACHE_KEY, JSON.stringify({
      token,
      expiresAt: Date.now() + (expiresInSec || 3500) * 1000,
    }));
  } catch (e) {}
}
function clearCachedGdriveToken() {
  sessionStorage.removeItem(GDRIVE_TOKEN_CACHE_KEY);
}

function ensureGdriveTokenClient() {
  if (gdriveTokenClient) return gdriveTokenClient;
  if (!window.google || !google.accounts || !google.accounts.oauth2) {
    throw new Error("Googleログインの読み込みに失敗しました。通信環境を確認してもう一度お試しください。");
  }
  gdriveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GDRIVE_CLIENT_ID,
    scope: GDRIVE_SCOPE,
    callback: () => {},
  });
  return gdriveTokenClient;
}

function requestGdriveTokenWithPrompt(promptValue) {
  return new Promise((resolve, reject) => {
    try {
      const client = ensureGdriveTokenClient();
      client.callback = (resp) => {
        if (resp.error) { reject(new Error(resp.error)); return; }
        gdriveAccessToken = resp.access_token;
        cacheGdriveToken(resp.access_token, resp.expires_in);
        resolve(resp.access_token);
      };
      client.requestAccessToken({ prompt: promptValue });
    } catch (e) {
      reject(e);
    }
  });
}

/* 前回許可した実績があれば、まずポップアップなしでの再認可を試み、
   ダメだった時だけ確認画面を出す(毎回聞かれるのを避けるため) */
async function requestGdriveToken() {
  try {
    return await requestGdriveTokenWithPrompt("");
  } catch (e) {
    return await requestGdriveTokenWithPrompt("consent");
  }
}

async function gdriveFetch(url, options = {}) {
  const token = gdriveAccessToken || (await requestGdriveToken());
  let res = await fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${token}` },
  });
  if (res.status === 401) {
    gdriveAccessToken = null;
    clearCachedGdriveToken();
    const newToken = await requestGdriveToken();
    res = await fetch(url, {
      ...options,
      headers: { ...(options.headers || {}), Authorization: `Bearer ${newToken}` },
    });
  }
  return res;
}

async function getOrCreateGdriveFolder() {
  const cached = localStorage.getItem(GDRIVE_FOLDER_KEY);
  if (cached) return cached;

  const q = encodeURIComponent("mimeType='application/vnd.google-apps.folder' and name='Vaultlyバックアップ' and trashed=false");
  const listRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const listJson = await listRes.json();
  if (listJson.files && listJson.files.length > 0) {
    localStorage.setItem(GDRIVE_FOLDER_KEY, listJson.files[0].id);
    return listJson.files[0].id;
  }

  const createRes = await gdriveFetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name: "Vaultlyバックアップ", mimeType: "application/vnd.google-apps.folder" }),
  });
  const createJson = await createRes.json();
  localStorage.setItem(GDRIVE_FOLDER_KEY, createJson.id);
  return createJson.id;
}

const GDRIVE_BACKUP_FILENAME = "vaultly-backup.json";
const GDRIVE_FILE_ID_KEY = "pv_gdrive_file_id";
const GDRIVE_PLAIN_FILENAME = "vaultly-export-plain.txt";
const GDRIVE_PLAIN_FILE_ID_KEY = "pv_gdrive_plain_file_id";
const GDRIVE_AUTOSYNC_KEY = "pv_gdrive_autosync";

async function findExistingFileIdByName(folderId, filename, cacheKey) {
  const cached = cacheKey && localStorage.getItem(cacheKey);
  if (cached) return cached;

  const q = encodeURIComponent(`name='${filename}' and '${folderId}' in parents and trashed=false`);
  const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const json = await res.json();
  if (json.files && json.files.length > 0) {
    if (cacheKey) localStorage.setItem(cacheKey, json.files[0].id);
    return json.files[0].id;
  }
  return null;
}

/* 同じファイルを上書き保存する(存在しなければ新規作成) */
async function uploadContentToDrive(filename, mimeType, content, cacheKey) {
  const folderId = await getOrCreateGdriveFolder();
  const existingId = await findExistingFileIdByName(folderId, filename, cacheKey);

  const metadata = existingId ? {} : { name: filename, parents: [folderId] };
  const boundary = "pvboundary" + Date.now();
  const body =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(metadata) + `\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: ${mimeType}\r\n\r\n` +
    content + `\r\n` +
    `--${boundary}--`;

  const url = existingId
    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart&fields=id,modifiedTime`
    : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime";

  const uploadRes = await gdriveFetch(url, {
    method: existingId ? "PATCH" : "POST",
    headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!uploadRes.ok) throw new Error("upload failed: " + uploadRes.status);
  const json = await uploadRes.json();
  if (!existingId && cacheKey) localStorage.setItem(cacheKey, json.id);
  return json.modifiedTime;
}

const GDRIVE_KNOWN_MODIFIED_KEY = "pv_gdrive_known_modified_time";

/* 保存を1件ずつ順番に行うためのキュー。並行して複数走らせると、通信の
   到着順が前後して古い内容が新しい内容を上書きしてしまうことがあるため、
   手動保存・自動保存を問わず必ず前の保存が終わってから次を始める。 */
let gdriveSyncQueue = Promise.resolve();
function uploadBackupToDrive() {
  const task = gdriveSyncQueue.then(async () => {
    const store = loadStore();
    const payload = JSON.stringify({ app: "passvault", version: 1, ...store }, null, 2);
    const modifiedTime = await uploadContentToDrive(GDRIVE_BACKUP_FILENAME, "application/json", payload, GDRIVE_FILE_ID_KEY);
    if (modifiedTime) localStorage.setItem(GDRIVE_KNOWN_MODIFIED_KEY, modifiedTime);
  });
  gdriveSyncQueue = task.catch(() => {});
  return task;
}

/* 他の端末でGoogleドライブに保存したバックアップを取り込む(端末間で同じデータを見られるようにする) */
async function downloadBackupFromDrive() {
  const folderId = await getOrCreateGdriveFolder();
  const fileId = await findExistingFileIdByName(folderId, GDRIVE_BACKUP_FILENAME, GDRIVE_FILE_ID_KEY);
  if (!fileId) {
    const err = new Error("no-backup-found");
    err.code = "no-backup-found";
    throw err;
  }
  const metaRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`);
  const meta = metaRes.ok ? await metaRes.json() : {};
  const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if (!res.ok) throw new Error("download failed: " + res.status);
  const obj = await res.json();
  if (!obj.salt || !obj.iv || !obj.data || !obj.iterations) {
    const err = new Error("invalid-backup");
    err.code = "invalid-backup";
    throw err;
  }
  return { backupStore: obj, modifiedTime: meta.modifiedTime };
}

async function restoreFromGoogleDrive() {
  try {
    showToast("Googleドライブから確認しています…");
    const { backupStore } = await downloadBackupFromDrive();
    openRestorePasswordSheet(backupStore);
  } catch (e) {
    console.error(e);
    if (e.code === "no-backup-found") {
      alert("Googleドライブにバックアップが見つかりませんでした。先に別の端末で「Googleドライブに保存」を行ってください。");
    } else {
      alert("Googleドライブからの読み込みに失敗しました。もう一度お試しください。");
    }
  }
}

/* ========================= 端末間同期(リロード・ロック解除時) ========================= */
/* アプリを開き直す(リロードする・ロック解除する)たびに、Googleドライブ側が更新されていれば裏で取り込む。
   同じマスターパスワード(=同じsalt)でセットアップした端末同士でのみ復号に成功する。 */

async function checkAndPullFromDrive() {
  if (localStorage.getItem(GDRIVE_AUTOSYNC_KEY) !== "1") return false;
  if (!state.key || !state.vault) return false;
  try {
    const folderId = await getOrCreateGdriveFolder();
    const fileId = await findExistingFileIdByName(folderId, GDRIVE_BACKUP_FILENAME, GDRIVE_FILE_ID_KEY);
    if (!fileId) return false;

    const metaRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`);
    if (!metaRes.ok) return false;
    const meta = await metaRes.json();
    if (localStorage.getItem(GDRIVE_KNOWN_MODIFIED_KEY) === meta.modifiedTime) return false; // 変化なし

    const contentRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (!contentRes.ok) return false;
    const backupStore = await contentRes.json();
    const vault = await decryptObj(state.key, backupStore.iv, backupStore.data); // saltが同じ端末同士なら復号できる

    state.vault = vault;
    const store = loadStore();
    store.iv = backupStore.iv;
    store.data = backupStore.data;
    saveStore(store);
    localStorage.setItem(GDRIVE_KNOWN_MODIFIED_KEY, meta.modifiedTime);
    return true;
  } catch (e) {
    // saltが違う(=別々にセットアップした端末)場合はここで静かに失敗する。異常ではないので握りつぶす。
    return false;
  }
}

async function autoPullAndRefresh() {
  const changed = await checkAndPullFromDrive();
  if (changed && state.key) {
    state.openSiteId = null;
    renderPartialList();
    showToast("他の端末の変更を取り込みました");
  }
}

/* アカウントの追加・編集・削除のたびに自動で呼ばれる(接続済みの場合のみ) */

  try {
    await uploadBackupToDrive();
  } catch (e) {
    console.error(e);
    showToast("Googleドライブへの自動保存に失敗しました");
  }
}

/* ========================= 自動ロック ========================= */
const IDLE_MS = 5 * 60 * 1000;
function resetIdleTimer() {
  if (!state.key) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(lockVault, IDLE_MS);
}
["click", "touchstart", "keydown", "scroll"].forEach((ev) =>
  document.addEventListener(ev, resetIdleTimer, { passive: true })
);

function lockVault() {
  state.key = null;
  state.vault = null;
  state.openSiteId = null;
  state.maskState.clear();
  clearTimeout(idleTimer);
  clearSessionKeyCache();
  render();
}

/* ========================= 保存 ========================= */
async function persistVault() {
  const store = loadStore();
  const enc2 = await encryptObj(state.key, state.vault);
  store.iv = enc2.iv;
  store.data = enc2.data;
  saveStore(store);
  autoSyncToGoogleDrive(); // 接続済みなら裏で自動アップロード(完了を待たない)
}

/* ========================= トースト ========================= */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1400);
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  showToast((label ? label + "を" : "") + "コピーしました");
}

/* ========================= 画面: メイン ========================= */
function siteInitial(name) {
  return (name || "?").trim().charAt(0).toUpperCase() || "?";
}

function normalizeForSearch(s) {
  return String(s ?? "").normalize("NFKC").toLowerCase();
}

function filteredSites() {
  const q = normalizeForSearch(state.search.trim());
  if (!q) return state.vault.sites;
  return state.vault.sites.filter((s) => normalizeForSearch(s.name).includes(q));
}

function renderMain() {
  const sites = filteredSites();
  const listHtml = sites.length
    ? sites.map(renderSiteCard).join("")
    : `<div class="empty-state">${state.vault.sites.length ? "一致するアカウントがありません" : "まだ何も登録されていません。<br>右下の + から追加しましょう。"}</div>`;

  return `

    <h2>Password</h2>
    <button class="icon-btn" id="settingsBtn">⚙️</button>
    <button class="icon-btn" id="lockBtn">🔒</button>
  </header>

    <input type="text" id="searchInput" placeholder="アカウント名で検索" value="${escapeHtml(state.search)}" />
  </div>
  <main class="content">${listHtml}</main>
  <button class="fab" id="addSiteBtn">＋</button>
  `;
}

function renderSiteCard(site) {
  const isOpen = state.openSiteId === site.id;
  const fieldsHtml = site.entries.map((f) => {
    const masked = isMasked(f);
    const displayVal = masked ? "••••••••" : escapeHtml(f.value);
    return `
      <div class="field-row" data-copy="${f.id}">
        <div class="ftext">
          <div class="flabel">${escapeHtml(f.label)}</div>
          <div class="fvalue">${displayVal || "&nbsp;"}</div>
        </div>
        <span class="feye" data-toggle="${f.id}">${masked ? ICONS.eyeClosed : ICONS.eyeOpen}</span>
        <span class="fcopy">${ICONS.copy}</span>
      </div>`;
  }).join("");

  const memoHtml = site.memo ? `<div class="memo-box">${escapeHtml(site.memo)}</div>` : "";

  return `
  <div class="site-card ${isOpen ? "open" : ""}" data-site="${site.id}">
    <div class="site-head" data-toggle-site="${site.id}">
      <div class="avatar">${escapeHtml(siteInitial(site.name))}</div>
      <div class="site-name-wrap">
        <div class="site-name">${escapeHtml(site.name)}</div>
        <div class="site-sub">${site.entries.length}項目</div>
      </div>
      <div class="chevron">▶</div>
    </div>
    <div class="site-body">
      ${fieldsHtml}
      ${memoHtml}
      <div class="card-actions">
        <button class="btn secondary" data-edit="${site.id}">編集</button>
        <button class="btn danger" data-delete="${site.id}">削除</button>
      </div>
    </div>
  </div>`;
}

function bindMain() {
  document.getElementById("settingsBtn").addEventListener("click", () => openSettingsSheet());
  document.getElementById("lockBtn").addEventListener("click", lockVault);
  document.getElementById("addSiteBtn").addEventListener("click", () => openSiteSheet(null));

  const searchInput = document.getElementById("searchInput");
  searchInput.addEventListener("input", (e) => {
    state.search = e.target.value;
    renderPartialList();
  });

  bindListEvents();
}

function renderPartialList() {
  const main = document.querySelector("main.content");
  if (!main) return;
  const sites = filteredSites();
  main.innerHTML = sites.length
    ? sites.map(renderSiteCard).join("")
    : `<div class="empty-state">${state.vault.sites.length ? "一致するアカウントがありません" : "まだ何も登録されていません。<br>右下の + から追加しましょう。"}</div>`;
  bindListEvents();
}

function bindListEvents() {
  document.querySelectorAll("[data-toggle-site]").forEach((el) => {
    el.addEventListener("click", () => {
      const id = el.getAttribute("data-toggle-site");
      state.openSiteId = state.openSiteId === id ? null : id;
      renderPartialList();
    });
  });
  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-toggle");
      const site = state.vault.sites.find((s) => s.entries.some((f) => f.id === id));
      const field = site && site.entries.find((f) => f.id === id);
      if (!field) return;
      state.maskState.set(id, !isMasked(field));
      renderPartialList();
    });
  });
  document.querySelectorAll("[data-copy]").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-toggle]")) return;
      const fieldId = el.getAttribute("data-copy");
      const site = state.vault.sites.find((s) => s.entries.some((f) => f.id === fieldId));
      const field = site && site.entries.find((f) => f.id === fieldId);
      if (field) copyText(field.value, field.label);
    });
  });
  document.querySelectorAll("[data-edit]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openSiteSheet(el.getAttribute("data-edit"));
    });
  });
  document.querySelectorAll("[data-delete]").forEach((el) => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-delete");
      const site = state.vault.sites.find((s) => s.id === id);
      if (!site) return;
      if (confirm(`「${site.name}」を削除しますか？この操作は取り消せません。`)) {
        state.vault.sites = state.vault.sites.filter((s) => s.id !== id);
        await persistVault();
        renderPartialList();
      }
    });
  });
}

async function saveSiteFromSheet() {
  const name = document.getElementById("siteNameInput").value.trim();
  const memo = document.getElementById("siteMemoInput").value.trim();
  if (!name) { alert("アカウント名を入力してください"); return; }
  const SECRET_LABEL_RE = /パスワード|password|pass|pwd|pin|secret|暗証/i;
  const cleanFields = editingFields
    .filter((f) => f.label.trim() !== "" || f.value.trim() !== "")
    .map((f) => {
      const label = f.label.trim() || "項目";
      return { id: f.id, label, value: f.value, secret: SECRET_LABEL_RE.test(label) };
    });

  if (editingSiteId) {
    const site = state.vault.sites.find((s) => s.id === editingSiteId);
    site.name = name;
    site.memo = memo;
    site.entries = cleanFields;
  } else {
    state.vault.sites.push({ id: uid(), name, memo, entries: cleanFields });
  }
  await persistVault();
  closeOverlay();
  renderPartialList();
}

function openChangePasswordSheet() {
  const overlay = getOverlay();
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">マスターパスワードを変更</div>
      <div class="sfield">
        <label>現在のパスワード</label>
        <input type="password" id="curPw" autocomplete="current-password" />
      </div>
      <div class="sfield">
        <label>新しいパスワード</label>
        <input type="password" id="newPw1" autocomplete="new-password" />
      </div>
      <div class="sfield">
        <label>新しいパスワード（確認）</label>
        <input type="password" id="newPw2" autocomplete="new-password" />
      </div>
      <div class="error-msg" id="changePwError"></div>
      <div class="btn-row">
        <button class="btn secondary" id="cancelChangePw">キャンセル</button>
        <button class="btn" id="confirmChangePw">変更する</button>
      </div>
    </div>`;
  showOverlay();
  document.getElementById("cancelChangePw").addEventListener("click", closeOverlay);
  document.getElementById("confirmChangePw").addEventListener("click", async () => {
    const cur = document.getElementById("curPw").value;
    const n1 = document.getElementById("newPw1").value;
    const n2 = document.getElementById("newPw2").value;
    const errEl = document.getElementById("changePwError");
    const store = loadStore();
    try {
      const curKey = await deriveKey(cur, store.salt, store.iterations);
      await decryptObj(curKey, store.iv, store.data);
    } catch (e) {
      errEl.textContent = "現在のパスワードが違います";
      return;
    }
    if (n1.length < 4) { errEl.textContent = "4文字以上のパスワードを入力してください"; return; }
    if (n1 !== n2) { errEl.textContent = "新しいパスワードが一致しません"; return; }

    const newSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
    const newKey = await deriveKey(n1, newSalt, ITERATIONS);
    const { iv, data } = await encryptObj(newKey, state.vault);
    saveStore({ salt: newSalt, iterations: ITERATIONS, iv, data });
    state.key = newKey;
    cacheKeyForSession(newKey);
    closeOverlay();
    showToast("マスターパスワードを変更しました");
  });
}

/* 共有シートで渡せればそちら経由、できなければダウンロードにフォールバック */
async function shareOrDownloadFile(blob, filename) {
  if (navigator.canShare && navigator.share) {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return true;
      } catch (e) {
        if (e && e.name === "AbortError") return false;
        // 共有に失敗した場合は下のダウンロード方式にフォールバック
      }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

async function exportBackup() {
  const store = loadStore();
  const payload = JSON.stringify({ app: "passvault", version: 1, ...store }, null, 2);
  const date = new Date().toISOString().slice(0, 10);
  const filename = `passvault-backup-${date}.json`;
  const blob = new Blob([payload], { type: "application/json" });
  const done = await shareOrDownloadFile(blob, filename);
  if (done) showToast("バックアップを書き出しました");
}

/* 他のパスワード管理アプリへの乗り換え用に、暗号化なしの読める形式で書き出す */
function buildPlainTextExport() {
  const lines = [];
  lines.push("Vaultly エクスポート（暗号化なし）");
  lines.push(`書き出し日時: ${new Date().toLocaleString("ja-JP")}`);
  lines.push("");
  state.vault.sites.forEach((site) => {
    lines.push(`■ ${site.name}`);
    site.entries.forEach((f) => lines.push(`${f.label}: ${f.value}`));
    if (site.memo) lines.push(`メモ: ${site.memo}`);
    lines.push("");
  });
  return lines.join("\n");
}

async function exportPlainText() {
  if (!state.vault.sites.length) {
    alert("書き出せるアカウントがありません");
    return;
  }
  const ok = confirm(
    "この書き出しファイルは、パスワードが暗号化されていない読める状態のテキストです。\n\n" +
    "他のパスワード管理アプリへ移行する時など、必要な場合だけご利用ください。書き出したファイルは、使い終わったら削除することをおすすめします。\n\n" +
    "続けますか？"
  );
  if (!ok) return;

  const text = buildPlainTextExport();
  const date = new Date().toISOString().slice(0, 10);
  const filename = `vaultly-export-plain-${date}.txt`;
  const blob = new Blob([text], { type: "text/plain" });
  const done = await shareOrDownloadFile(blob, filename);
  if (done) showToast("テキストで書き出しました");
}

/* テキスト(暗号化なし)をGoogleドライブに保存。PC・iPhoneどちらでも同じ手順で使える */
async function savePlainTextToGoogleDrive() {
  if (!state.vault.sites.length) {
    alert("書き出せるアカウントがありません");
    return;
  }
  const ok = confirm(
    "Googleドライブに保存されるこのファイルは、パスワードが暗号化されていない読める状態のテキストです。\n\n" +
    "他のパスワード管理アプリへ移行する時など、必要な場合だけご利用ください。\n\n" +
    "続けますか？"
  );
  if (!ok) return;

  try {
    showToast("Googleにサインインしています…");
    const text = buildPlainTextExport();
    await uploadContentToDrive(GDRIVE_PLAIN_FILENAME, "text/plain; charset=UTF-8", text, GDRIVE_PLAIN_FILE_ID_KEY);

  } catch (e) {
    console.error(e);
    alert("Googleドライブへの保存に失敗しました。もう一度お試しください。");
  }
}

/* ロック画面からの復元: マスターパスワードごとバックアップの内容に置き換える(端末移行・パスワード紛失時向け) */
function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.salt || !obj.iv || !obj.data || !obj.iterations) throw new Error("invalid");
      if (!confirm("このバックアップで現在のデータを置き換えます。よろしいですか？")) return;
      saveStore({ salt: obj.salt, iterations: obj.iterations, iv: obj.iv, data: obj.data });
      showToast("復元しました。ロック解除してください");
      lockVault();
    } catch (err) {
      alert("バックアップファイルを読み込めませんでした");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* 設定画面からの復元: 今のマスターパスワード・Googleドライブ連携はそのままに、アカウントの中身だけをバックアップの内容に置き換える */
function handleImportFileSettings(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.salt || !obj.iv || !obj.data || !obj.iterations) throw new Error("invalid");
      openRestorePasswordSheet(obj);
    } catch (err) {
      alert("バックアップファイルを読み込めませんでした");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

      </div>
      <div class="sfield">

        <input type="password" id="restorePw" autocomplete="off" />
      </div>
      <div class="error-msg" id="restoreError"></div>
      <div class="btn-row">

        <button class="btn" id="confirmRestoreBtn">復元する</button>
      </div>
    </div>`;
  showOverlay();

  document.getElementById("cancelRestoreBtn").addEventListener("click", closeOverlay);
  document.getElementById("confirmRestoreBtn").addEventListener("click", async () => {
    const pw = document.getElementById("restorePw").value;
    const errEl = document.getElementById("restoreError");
    let importedVault;
    try {
      const backupKey = await deriveKey(pw, backupStore.salt, backupStore.iterations);
      importedVault = await decryptObj(backupKey, backupStore.iv, backupStore.data);
    } catch (e) {
      errEl.textContent = "パスワードが違います";
      return;
    }
    if (!confirm("現在のアカウントデータを、このバックアップの内容に置き換えます。よろしいですか？")) return;
    state.vault = importedVault;
    state.openSiteId = null;
    state.maskState.clear();
    await persistVault();
    closeOverlay();
    showToast("復元しました");
    render();
  });
}

/* ========================= オーバーレイ共通 ========================= */
function getOverlay() {
  let overlay = document.getElementById("overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.className = "overlay";
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }
  return overlay;
}
function showOverlay() {
  const overlay = getOverlay();
  requestAnimationFrame(() => overlay.classList.add("show"));
}
function closeOverlay() {
  const overlay = document.getElementById("overlay");
  if (overlay) overlay.classList.remove("show");
}

/* ========================= ルート描画 ========================= */
function render() {
  const app = document.getElementById("app");
  closeOverlay();
  if (!state.key) {
    const store = loadStore();
    if (!store) {
      app.innerHTML = renderSetup();
      bindSetup();
    } else {
      app.innerHTML = renderUnlock();
      bindUnlock();
    }
  } else {
    app.innerHTML = renderMain();
    bindMain();
  }
}

(async () => {
  const unlocked = await tryAutoUnlock();
  if (unlocked) {
    resetIdleTimer();
    autoPullAndRefresh();
  }
  render();
})();
