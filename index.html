<style>
  :root {
    --bg: #000000;
    --surface: rgba(5,19,10,0.88);
    --surface-2: rgba(5,19,10,0.97);
    --border: rgba(0,143,17,0.3);
    --text: #EFFFF2;
    --text-dim: rgba(231,247,236,0.45);
    --accent-1: #00FF41;
    --accent-2: #008F11;
    --accent-ink: #0D0208;
    --danger: #ff3b3b;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: 'Share Tech Mono', -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", monospace;
    -webkit-text-size-adjust: 100%;
    overscroll-behavior-y: contain;
  }
  #app { min-height: 100vh; padding-top: var(--safe-top); padding-bottom: var(--safe-bottom); display: flex; flex-direction: column; }
  input, textarea, button { font-family: inherit; }
  ::selection { background: var(--accent-1); color: var(--accent-ink); }

  .center-screen {
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 24px calc(32px + var(--safe-bottom));
    text-align: center;
  }
  .logo-badge {
    width: 72px; height: 72px; border-radius: 4px;
    background: var(--surface); border: 1px solid var(--accent-1);
    color: var(--accent-1);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin-bottom: 18px;
    box-shadow: 0 0 4px var(--accent-1), 0 0 9px var(--accent-1);
  }
  h1.title { font-size: 22px; margin: 0 0 6px; font-weight: 700; }
  p.subtitle { color: var(--text-dim); font-size: 14px; margin: 0 0 28px; line-height: 1.6; }

  .field {
    width: 100%; max-width: 340px; text-align: left; margin-bottom: 14px;
  }
  .field label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 6px; font-weight: 600; }
  .field input {
    width: 100%; padding: 13px 14px; border-radius: 4px; border: 1px solid var(--border);
    background: var(--surface); color: var(--text); font-size: 16px; outline: none;
  }
  .field input:focus { border-color: var(--accent-1); box-shadow: 0 0 4px var(--accent-1), 0 0 9px var(--accent-1); }

  .btn {
    appearance: none; cursor: pointer;
    padding: 13px; border-radius: 0; font-size: 13px; font-weight: 400; letter-spacing: 0.02em;
    width: 100%; max-width: 340px; color: var(--accent-1);
    background: var(--surface); border: 1px solid var(--accent-1);
    box-shadow: 0 0 4px currentColor, 0 0 9px currentColor; transition: transform .12s ease, filter .12s ease;
  }
  .btn:active { transform: scale(0.96); filter: brightness(1.3); }
  .btn.secondary {
    background: var(--surface); color: rgba(231,247,236,0.4); border: 1px solid rgba(231,247,236,0.4);
  }
  .btn.ghost { background: transparent; box-shadow: none; border: none; color: var(--accent-1); font-weight: 600; padding: 10px; }
  .btn.danger { background: var(--surface); color: var(--danger); border: 1px solid var(--danger); box-shadow: 0 0 4px var(--danger), 0 0 9px var(--danger); }
  .btn-row { display: flex; gap: 10px; width: 100%; max-width: 340px; }
  .btn-row .btn { width: auto; flex: 1; }

  .error-msg { color: var(--danger); font-size: 13px; min-height: 18px; margin: -4px 0 10px; text-shadow: 0 0 4px currentColor, 0 0 9px currentColor; }
  .warn-box {
    position: relative; max-width: 340px; text-align: left; background: var(--surface);
    border: 1px solid rgba(255,59,59,0.5); border-radius: 0; padding: 16px;
    font-size: 11.5px; color: var(--danger); line-height: 1.8; margin-bottom: 22px;
    text-shadow: 0 0 4px currentColor, 0 0 9px currentColor;
    display: flex; gap: 11px; align-items: flex-start;
    --cv-c: var(--danger);
  }
  .warn-box.dim { color: rgba(231,247,236,0.7); text-shadow: none; --cv-c: var(--accent-2); border-color: rgba(0,143,17,0.4); }
  .warn-box svg { flex-shrink: 0; width: 20px; height: 20px; margin-top: 1px; }

  /* full-screen sub-sheet header, traced from the mockup's back-arrow pattern */
  .sheet-head2 {
    display: flex; align-items: center; gap: 14px;
    margin: 0 -24px 20px; padding: 22px 24px 14px;
    border-bottom: 1px solid rgba(0,143,17,0.25);
  }
  .sheet-head2 .back-btn {
    background: none; border: none; padding: 0; display: flex; cursor: pointer; color: var(--accent-2); flex-shrink: 0;
  }
  .sheet-head2 .back-btn svg { width: 18px; height: 18px; }
  .sheet-head2 h3 {
    font-size: 19px; font-weight: 400; letter-spacing: 0.03em; color: var(--text); margin: 0; flex: 1;
  }
  .settings-group-label {
    font-size: 9px; color: rgba(0,143,17,0.7); letter-spacing: 0.1em; text-transform: uppercase;
    margin: 20px 0 6px;
  }
  .settings-group-label:first-child { margin-top: 0; }
  .settings-group {
    position: relative; background: var(--surface); border: 1px solid rgba(0,143,17,0.3); padding: 0 12px;
    --cv-c: rgba(0,143,17,0.3);
  }
  .settings-group.danger { border-color: rgba(255,59,59,0.4); box-shadow: 0 0 4px rgba(255,59,59,0.4), 0 0 9px rgba(255,59,59,0.4); --cv-c: var(--danger); margin-top: 20px; }
  .settings-row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: none; border: none;
    padding: 13px 4px; color: var(--text); font-size: 12px; cursor: pointer;
  }
  .settings-row + .settings-row { border-top: 1px solid rgba(231,247,236,0.08); }
  .settings-row .si-icon { display: flex; flex-shrink: 0; color: var(--accent-2); }
  .settings-row .si-icon svg { width: 15px; height: 15px; }
  .settings-row .si-chev svg { width: 12px; height: 12px; }
  .settings-row .si-chev { display: flex; flex-shrink: 0; color: var(--accent-2); }
  .settings-row.danger, .settings-row.danger .si-icon, .settings-row.danger .si-chev { color: var(--danger); }
  .settings-note { font-size: 10px; color: rgba(231,247,236,0.35); line-height: 1.8; margin: 18px 0 0; }

  /* ---- Main screen ---- */
  .rain-wrap { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; background: var(--bg); opacity: 0; transition: opacity .6s ease; }
  .rain-wrap *{animation-play-state:paused !important;}
  .rain-wrap.active{opacity:1;}
  .rain-wrap.active *{animation-play-state:running !important;}
  .rain-wrap.flash{opacity:1;}
  .rain-wrap.flash *{animation-play-state:running !important; animation-iteration-count:1 !important;}
  .rain-wrap.resetting *{animation-name:none !important; animation-play-state:paused !important;}
  .rain-shade{position:absolute; inset:0; background:linear-gradient(180deg, rgba(0,0,0,0.45) 0%, rgba(0,0,0,0.2) 30%, rgba(0,0,0,0.6) 100%);}
  .rcol2{position:absolute; top:0; width:14px; overflow:hidden; display:flex; flex-direction:column; contain:strict; will-change:transform; transform:translateZ(0);}
  .gc1 .dk{position:absolute; left:calc(50% + 2px); top:-1px; font-style:normal;}
  .gcell{position:relative; height:9px; line-height:9px; text-align:center; font-family:'Share Tech Mono',monospace; font-size:10px; -webkit-text-stroke:0.35px currentColor;}
  .gc1,.gc2{position:absolute; inset:0; opacity:0; animation-iteration-count:infinite;}

  header.top {
    position: sticky; top: 0; z-index: 5;
    padding: 22px 24px 0;
    background: linear-gradient(180deg, var(--bg) 78%, transparent);
    display: flex; align-items: center; justify-content: space-between;
  }
  header.top h2 {
    font-size: 30px; margin: 0; font-weight: 400; letter-spacing: 0.04em; line-height: 1;
    color: var(--text);
  }
  .header-icons { display: flex; align-items: center; gap: 0; }
  .icon-btn {
    background: none; border: none; padding: 6px; display: flex; align-items: center; justify-content: center;
    color: var(--accent-2); cursor: pointer; transition: transform .12s ease, filter .12s ease;
  }
  .icon-btn:active { transform: scale(0.9); filter: brightness(1.4); }
  .icon-btn svg { width: 22px; height: 22px; }
  .header-subtitle {
    padding: 6px 24px 0; position: relative; z-index: 1;
    font-size: 10px; color: rgba(0,143,17,0.75); letter-spacing: 0.08em;
  }
  main.content { padding: 20px 20px 16px; position: relative; z-index: 1; flex: 1; }
  .empty-state { text-align: center; color: var(--text-dim); padding: 60px 20px; font-size: 14px; line-height: 1.8; }

  .site-card {
    position: relative; background: var(--surface); border: 1px solid var(--cv-b, rgba(0,143,17,0.6)); padding: 12px 15px;
    box-shadow: 0 0 4px var(--cv-s, #008F11), 0 0 9px var(--cv-s, #008F11);
    margin-bottom: 11px; overflow: hidden; opacity: var(--card-dim, 1); transform: scale(var(--card-scale, 1));
    transition: opacity .4s ease, transform .4s ease, border-color .4s ease, box-shadow .4s ease;
  }
  .site-head { display: flex; align-items: center; gap: 13px; cursor: pointer; }
  .badge-ring {
    position: relative; width: 30px; height: 30px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; color: var(--cv-c, var(--accent-2));
  }
  .badge-ring::before {
    content: ""; position: absolute; inset: 0; border: 1.3px solid currentColor; border-radius: 50%;
  }
  .badge-ring svg { width: 13px; height: 13px; }
  .folder-head .badge-ring { width: 36px; height: 36px; }
  .folder-head .badge-ring svg { width: 17px; height: 17px; }
  .site-name-wrap { flex: 1; min-width: 0; }
  .site-name { font-weight: 400; font-size: 14px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .site-sub { font-size: 9px; color: rgba(231,247,236,0.65); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chevron-icon { color: var(--cv-c, var(--accent-2)); transition: transform .4s cubic-bezier(.16,1,.3,1); flex-shrink: 0; }
  .chevron-icon svg { width: 13px; height: 13px; display: block; }
  .site-card.open .chevron-icon { transform: rotate(180deg); }

  .site-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.16,1,.3,1); }
  .site-card.open .site-body { grid-template-rows: 1fr; }
  .sb-inner { overflow: hidden; min-height: 0; opacity: 0; transform: translateY(-4px); transition: opacity .35s ease .05s, transform .35s ease .05s; }
  .site-card.open .sb-inner { opacity: 1; transform: translateY(0); }
  .sb-pad { margin-top: 8px; padding-top: 8px; border-top: 1px solid rgba(0,143,17,0.25); }
  .site-card.open { --cv-c: #00FF41; --cv-b: rgba(0,255,65,0.85); --cv-s: rgba(0,255,65,0.85); }

  .folder-card {
    position: relative; background: var(--surface); border: 1px solid var(--cv-b, rgba(0,143,17,0.6));
    box-shadow: 0 0 4px var(--cv-s, #008F11), 0 0 9px var(--cv-s, #008F11);
    margin-bottom: 11px; overflow: hidden; opacity: var(--card-dim, 1); transform: scale(var(--card-scale, 1));
    transition: opacity .4s ease, transform .4s ease, border-color .4s ease, box-shadow .4s ease;
  }
  .folder-head { display: flex; align-items: center; gap: 13px; padding: 15px 17px; cursor: pointer; }
  .folder-name-wrap { flex: 1; min-width: 0; }
  .folder-name { font-weight: 400; font-size: 23px; color: var(--text); letter-spacing: 0.03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder-card .chevron-icon svg { width: 14px; height: 14px; }
  .folder-card.open > .folder-head .chevron-icon { transform: rotate(180deg); }
  .folder-body { display: grid; grid-template-rows: 0fr; padding: 0 17px; transition: grid-template-rows .45s cubic-bezier(.16,1,.3,1); }
  .folder-card.open .folder-body { grid-template-rows: 1fr; }
  .fb-inner { overflow: hidden; min-height: 0; }
  .fb-pad { padding: 2px 0 15px; }
  .folder-card.open { --cv-c: #00FF41; --cv-b: rgba(0,255,65,0.85); --cv-s: rgba(0,255,65,0.85); }
  .folder-head .site-sub { font-size: 10px; color: rgba(231,247,236,0.65); margin-top: 3px; }
  .folder-body .swipe-row { margin-bottom: 12px; }
  .folder-body .site-card:not(.open) { --cv-c: #008F11; --cv-b: rgba(0,143,17,0.6); --cv-s: #008F11; box-shadow: 0 0 4px #008F11, 0 0 9px #008F11; }

  .swipe-row { position: relative; overflow: visible; border-radius: 4px; margin-bottom: 12px; background: var(--bg); }
  .swipe-row .swipe-fg { position: relative; z-index: 1; background: var(--bg); border-radius: 4px; }
  .swipe-row .swipe-fg .site-card, .swipe-row .swipe-fg .folder-card { margin-bottom: 0; }
  .swipe-actions { position: absolute; top: 0; right: 0; bottom: 0; display: flex; z-index: 0; }
  .swipe-action-btn {
    appearance: none; border: none; color: #fff; font-size: 13px; font-weight: 700; cursor: pointer;
    width: 76px; display: flex; align-items: center; justify-content: center; padding: 0 4px; text-align: center;
  }
  .swipe-action-btn.delete { background: var(--surface); color: var(--danger); border-left: 1px solid var(--danger); text-shadow: 0 0 4px currentColor, 0 0 9px currentColor; }

  .icon-edit-btn {
    appearance: none; border: none; background: none; color: var(--text-dim);
    padding: 6px; margin: -6px 0; display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .icon-edit-btn:active { color: var(--accent-1); }

  .dragging { box-shadow: 0 14px 30px rgba(0,0,0,0.28); opacity: 0.96; }
  .reorder-placeholder { border-radius: 16px; background: var(--surface-2); opacity: 0.5; }

  .field-row { display: flex; align-items: center; gap: 10px; padding: 11px 2px; cursor: pointer; }
  .field-row + .field-row { border-top: 1px solid rgba(231,247,236,0.08); }
  .field-row .flabel { font-size: 9px; color: rgba(0,143,17,0.7); letter-spacing: 0.08em; margin-bottom: 4px; text-transform: uppercase; }

<body>
<div id="app"></div>
<div id="toast"></div>

<script>
"use strict";

/* ========================= 暗号まわり ========================= */
const enc = new TextEncoder();
const dec = new TextDecoder();

function toB64(buf) {
  const bytes = new Uint8Array(buf);
  let bin = "";
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}
function fromB64(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

async function deriveKey(password, saltB64, iterations) {
  const baseKey = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: fromB64(saltB64), iterations, hash: "SHA-256" },
    baseKey,
    { name: "AES-GCM", length: 256 },
    true,
    ["encrypt", "decrypt"]
  );
}

/* ========================= タブを閉じてもロック解除状態を一定時間保持 ========================= */
/* マスターパスワードを毎回聞かれる煩わしさを減らすため、直近の解除から一定時間はスキップする。
   その間は端末を触れる人なら誰でも中身を見られるので、時間を延ばしすぎないこと。 */
const UNLOCK_CACHE_KEY = "pv_unlock_cache";
const UNLOCK_CACHE_HOURS = 4;

async function cacheKeyForSession(key) {
  try {
    const raw = await crypto.subtle.exportKey("raw", key);
    localStorage.setItem(UNLOCK_CACHE_KEY, JSON.stringify({
      key: toB64(raw),
      expiresAt: Date.now() + UNLOCK_CACHE_HOURS * 3600 * 1000,
    }));
  } catch (e) {
    // キャッシュに失敗しても致命的ではないので無視する
  }
}

function clearSessionKeyCache() {
  localStorage.removeItem(UNLOCK_CACHE_KEY);
}

async function tryAutoUnlock() {
  const raw = localStorage.getItem(UNLOCK_CACHE_KEY);
  const store = loadStore();
  if (!raw || !store) return false;
  try {
    const cached = JSON.parse(raw);
    if (!cached.key || !cached.expiresAt || Date.now() >= cached.expiresAt) {
      clearSessionKeyCache();
      return false;
    }
    const key = await crypto.subtle.importKey("raw", fromB64(cached.key), { name: "AES-GCM" }, true, ["encrypt", "decrypt"]);
    const vault = await decryptObj(key, store.iv, store.data);
    state.key = key;
    state.vault = normalizeVault(vault);
    return true;
  } catch (e) {
    clearSessionKeyCache();
    return false;
  }
}

async function encryptObj(key, obj) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const data = enc.encode(JSON.stringify(obj));
  const cipher = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, data);
  return { iv: toB64(iv), data: toB64(cipher) };
}

async function decryptObj(key, ivB64, dataB64) {
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: fromB64(ivB64) }, key, fromB64(dataB64)
  );
  return JSON.parse(dec.decode(plain));
}

/* ========================= ストレージ ========================= */
const STORE_KEY = "pv_store_v1";
const ITERATIONS = 250000;

function loadStore() {
  const raw = localStorage.getItem(STORE_KEY);
  return raw ? JSON.parse(raw) : null;
}
function saveStore(store) {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(store));
  } catch (e) {
    console.error(e);
    if (e && (e.name === "QuotaExceededError" || e.code === 22)) {
      alert("保存容量の上限に達しているため、保存できませんでした。\n\n今回の変更は反映されていません（今までのデータはそのまま残っています）。");
    } else {
      alert("データの保存に失敗しました。\n\nもう一度お試しください。");
    }
    throw e;
  }
}

/* ========================= Googleドライブ連携 ========================= */
const GDRIVE_CLIENT_ID = "151024751905-f74rcgi65ao8149pqrujusjeb7lq5ohv.apps.googleusercontent.com";
/* トークン交換にはGoogleのクライアントシークレットが要るが、静的サイトのコードには埋め込めないため、
   シークレットを保管した中継サーバー(Cloudflare Workers)経由でGoogleと通信する。 */
const GDRIVE_TOKEN_PROXY_URL = "https://vaultly-oauth-proxy.vaultly-contact.workers.dev";
const GDRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
const GDRIVE_FOLDER_KEY = "pv_gdrive_folder_id";
const GDRIVE_TOKEN_CACHE_KEY = "pv_gdrive_token_cache";
const GDRIVE_REFRESH_TOKEN_KEY = "pv_gdrive_refresh_token";
let gdriveAccessToken = loadCachedGdriveToken();

/* アクセストークン(約1時間で失効する)をタブが閉じるまで保持する */
function loadCachedGdriveToken() {
  try {
    const raw = sessionStorage.getItem(GDRIVE_TOKEN_CACHE_KEY);
    if (!raw) return null;
    const obj = JSON.parse(raw);
    if (!obj.token || !obj.expiresAt || Date.now() >= obj.expiresAt - 60000) return null;
    return obj.token;
  } catch (e) {
    return null;
  }
}
function cacheGdriveToken(token, expiresInSec) {
  try {
    sessionStorage.setItem(GDRIVE_TOKEN_CACHE_KEY, JSON.stringify({
      token,
      expiresAt: Date.now() + (expiresInSec || 3500) * 1000,
    }));
  } catch (e) {}
}
function clearCachedGdriveToken() {
  sessionStorage.removeItem(GDRIVE_TOKEN_CACHE_KEY);
}

/* リフレッシュトークン(失効しない限りずっと使える)は端末に保存しておく。
   これがあれば、アクセストークンが切れても、画面を切り替えずに裏側だけで更新できる。 */
function loadCachedGdriveRefreshToken() {
  try {
    return localStorage.getItem(GDRIVE_REFRESH_TOKEN_KEY) || null;
  } catch (e) {
    return null;
  }
}
function cacheGdriveRefreshToken(token) {
  try {
    localStorage.setItem(GDRIVE_REFRESH_TOKEN_KEY, token);
  } catch (e) {}
}
function clearCachedGdriveRefreshToken() {
  localStorage.removeItem(GDRIVE_REFRESH_TOKEN_KEY);
}

/* ========================= Google連携(画面ごと切り替わるリダイレクト方式) =========================
   ポップアップ方式は、ホーム画面に追加した状態(ウェブアプリ化)ではブロックされて
   何も起きないまま固まることがあるため、ポップアップを一切使わず、画面ごとGoogleの
   サインインページに切り替わり、終わったらこのアプリに戻ってくる方式にしている。

   さらに認可コード方式(PKCE)+リフレッシュトークンを使い、最初の1回だけ画面が
   切り替わって連携すれば、以降はアクセストークンが切れても裏側で自動更新され、
   毎回ユーザーに再連携を求めずに済むようにしている。 */
const GDRIVE_REDIRECT_URI = location.origin + location.pathname;
const GDRIVE_RESUME_SYNC_KEY = "pv_gdrive_resume_sync";
const GDRIVE_PKCE_VERIFIER_KEY = "pv_gdrive_pkce_verifier";

function base64UrlEncode(bytes) {
  let str = "";
  for (const b of bytes) str += String.fromCharCode(b);
  return btoa(str).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function randomPkceVerifier() {
  const bytes = new Uint8Array(32);
  crypto.getRandomValues(bytes);
  return base64UrlEncode(bytes);
}
async function pkceChallengeFromVerifier(verifier) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier));
  return base64UrlEncode(new Uint8Array(digest));
}

async function buildGdriveAuthUrl() {
  const verifier = randomPkceVerifier();
  sessionStorage.setItem(GDRIVE_PKCE_VERIFIER_KEY, verifier);
  const challenge = await pkceChallengeFromVerifier(verifier);
  const params = new URLSearchParams({
    client_id: GDRIVE_CLIENT_ID,
    redirect_uri: GDRIVE_REDIRECT_URI,
    response_type: "code",
    scope: GDRIVE_SCOPE,
    include_granted_scopes: "true",
    access_type: "offline",
    prompt: "consent",
    code_challenge: challenge,
    code_challenge_method: "S256",
  });
  return `https://accounts.google.com/o/oauth2/v2/auth?${params.toString()}`;
}

/* Googleとの連携が必要な操作を行った本人の操作(ボタン・確認ダイアログのOK)からだけ呼ぶこと。
   画面ごとGoogleへ切り替わるため、呼んだ時点でこの関数から戻ってくることはない。 */
async function redirectToGoogleSignIn() {
  localStorage.setItem(GDRIVE_RESUME_SYNC_KEY, "1");
  window.location.href = await buildGdriveAuthUrl();
}

/* アプリの起動時に1回だけ呼ぶ。Googleから戻ってきた直後であれば、
   URLに認可コードが入っているので、アクセストークン・リフレッシュトークンに交換してからURLをきれいに戻す */
async function consumeGdriveRedirectToken() {
  const code = new URLSearchParams(window.location.search).get("code");
  if (!code) return false;
  const verifier = sessionStorage.getItem(GDRIVE_PKCE_VERIFIER_KEY) || "";
  sessionStorage.removeItem(GDRIVE_PKCE_VERIFIER_KEY);
  history.replaceState(null, "", window.location.pathname);
  try {
    const res = await fetch(GDRIVE_TOKEN_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        grant_type: "authorization_code",
        code,
        code_verifier: verifier,
        redirect_uri: GDRIVE_REDIRECT_URI,
      }),
    });
    if (!res.ok) return false;
    const data = await res.json();
    gdriveAccessToken = data.access_token;
    cacheGdriveToken(data.access_token, data.expires_in);
    if (data.refresh_token) cacheGdriveRefreshToken(data.refresh_token);
    return true;
  } catch (e) {
    return false;
  }
}

/* アクセストークンが無い(または切れた)時に呼ぶ。リフレッシュトークンがあれば、
   画面を一切切り替えずに裏側だけでアクセストークンを更新する。
   リフレッシュトークン自体が無効な場合(本人が連携を解除した等)だけ false を返す。 */
async function ensureGdriveAccessToken() {
  if (gdriveAccessToken) return true;
  const refreshToken = loadCachedGdriveRefreshToken();
  if (!refreshToken) return false;
  try {
    const res = await fetch(GDRIVE_TOKEN_PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        grant_type: "refresh_token",
        refresh_token: refreshToken,
      }),
    });
    if (!res.ok) {
      if (res.status === 400 || res.status === 401) clearCachedGdriveRefreshToken();
      return false;
    }
    const data = await res.json();
    gdriveAccessToken = data.access_token;
    cacheGdriveToken(data.access_token, data.expires_in);
    return true;
  } catch (e) {
    return false;
  }
}

/* Googleとの連携が切れている時に呼ぶ。OKされたらそのままGoogleのサインイン画面へ切り替わる */
async function offerGdriveReconnect() {
  if (await confirmSheet({ title: "GOOGLE SIGN-IN", confirmLabel: "RECONNECT", html: "Googleとの連携が解除されています。<br><br>再連携しますか？" })) {
    redirectToGoogleSignIn();
  }
}

async function gdriveFetch(url, options = {}) {
  if (!(await ensureGdriveAccessToken())) {
    const err = new Error("gdrive-auth-required");
    err.code = "gdrive-auth-required";
    throw err;
  }
  const res = await fetch(url, {
    ...options,
    headers: { ...(options.headers || {}), Authorization: `Bearer ${gdriveAccessToken}` },
  });
  if (res.status === 401) {
    gdriveAccessToken = null;
    clearCachedGdriveToken();
    if (await ensureGdriveAccessToken()) {
      const retryRes = await fetch(url, {
        ...options,
        headers: { ...(options.headers || {}), Authorization: `Bearer ${gdriveAccessToken}` },
      });
      if (retryRes.status !== 401) return retryRes;
    }
    const err = new Error("gdrive-auth-required");
    err.code = "gdrive-auth-required";
    throw err;
  }
  return res;
}

const GDRIVE_API_KEY = "AIzaSyB0HKfA8crJaz4AkrmsXC9B0JqsOBELwv4";
let gdrivePickerReady = null;
function ensureGdrivePicker() {
  if (gdrivePickerReady) return gdrivePickerReady;
  gdrivePickerReady = new Promise((resolve, reject) => {
    if (!window.gapi) {
      reject(new Error("Googleの読み込みに失敗しました。通信環境を確認してもう一度お試しください。"));
      return;
    }
    gapi.load("picker", { callback: resolve, onerror: () => reject(new Error("フォルダ選択機能の読み込みに失敗しました。")) });
  });
  return gdrivePickerReady;
}

/* マイドライブ直下に保存するか、既存フォルダから選ぶかを先に選んでもらう
   (Googleのフォルダ選択画面はフォルダを一覧から選ぶだけの作りで、
   「マイドライブ自体」を選択肢として出せないため、ここで補っている) */
function chooseGdriveFolderMode() {
  return new Promise((resolve, reject) => {
    const overlay = getOverlay();
    overlay.innerHTML = `
      <div class="sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">保存先を選択</div>
        <button class="settings-item" id="pickRootBtn"><span class="si-icon">${ICONS.folder}</span>マイドライブ直下に保存する</button>
        <button class="settings-item" id="pickBrowseBtn"><span class="si-icon">${ICONS.folder}</span>既存のフォルダから選ぶ</button>
        <button class="btn secondary" id="cancelPickModeBtn">キャンセル</button>
      </div>`;
    showOverlay();
    document.getElementById("pickRootBtn").addEventListener("click", () => { closeOverlay(); resolve("root"); });
    document.getElementById("pickBrowseBtn").addEventListener("click", () => { closeOverlay(); resolve("browse"); });
    document.getElementById("cancelPickModeBtn").addEventListener("click", () => { closeOverlay(); reject(new Error("folder-pick-cancelled")); });
  });
}

/* 保存先フォルダをユーザーに選んでもらう(初めて接続する時、または選び直したい時) */
async function pickGdriveFolder() {
  const mode = await chooseGdriveFolderMode();
  if (mode === "root") return "root";

  if (!(await ensureGdriveAccessToken())) {
    const err = new Error("gdrive-auth-required");
    err.code = "gdrive-auth-required";
    throw err;
  }
  await ensureGdrivePicker();
  const token = gdriveAccessToken;
  return new Promise((resolve, reject) => {
    const view = new google.picker.DocsView(google.picker.ViewId.FOLDERS)
      .setParent("root")
      .setIncludeFolders(true)
      .setSelectFolderEnabled(true);
    const picker = new google.picker.PickerBuilder()
      .setOAuthToken(token)
      .setDeveloperKey(GDRIVE_API_KEY)
      .addView(view)
      .setTitle("保存先フォルダを選択")
      .setCallback((data) => {
        if (data.action === google.picker.Action.PICKED) {
          resolve(data.docs[0].id);
        } else if (data.action === google.picker.Action.CANCEL) {
          reject(new Error("folder-pick-cancelled"));
        }
      })
      .build();
    picker.setVisible(true);
  });
}

async function getOrCreateGdriveFolder() {
  const cached = localStorage.getItem(GDRIVE_FOLDER_KEY);
  if (cached) return cached;

  const folderId = await pickGdriveFolder();
  localStorage.setItem(GDRIVE_FOLDER_KEY, folderId);
  return folderId;
}

/* 保存先フォルダを選び直す(選び直すと、これ以降の保存先だけが変わる。過去のバックアップファイルは移動しない) */
async function repickGdriveFolder() {
  try {
    const folderId = await pickGdriveFolder();
    localStorage.setItem(GDRIVE_FOLDER_KEY, folderId);
    localStorage.removeItem(GDRIVE_FILE_ID_KEY);
    localStorage.removeItem(GDRIVE_PLAIN_FILE_ID_KEY);
    localStorage.removeItem(GDRIVE_KNOWN_MODIFIED_KEY);
    showToast("保存先フォルダを変更しました");
  } catch (e) {
    if (e && e.code === "gdrive-auth-required") {
      offerGdriveReconnect();
    } else if (!(e && e.message === "folder-pick-cancelled")) {
      console.error(e);
      alert("フォルダの選択に失敗しました。\n\nもう一度お試しください。");
    }
  }
}

const GDRIVE_BACKUP_FILENAME = "vaultly-backup.json";
const GDRIVE_FILE_ID_KEY = "pv_gdrive_file_id";
const GDRIVE_PLAIN_FILENAME = "vaultly-export-plain.txt";
const GDRIVE_PLAIN_FILE_ID_KEY = "pv_gdrive_plain_file_id";
const GDRIVE_AUTOSYNC_KEY = "pv_gdrive_autosync";

async function findExistingFileIdByName(folderId, filename, cacheKey) {
  const cached = cacheKey && localStorage.getItem(cacheKey);
  if (cached) return cached;

  const q = encodeURIComponent(`name='${filename}' and '${folderId}' in parents and trashed=false`);
  const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const json = await res.json();
  if (json.files && json.files.length > 0) {
    if (cacheKey) localStorage.setItem(cacheKey, json.files[0].id);
    return json.files[0].id;
  }
  return null;
}

/* 同じファイルを上書き保存する(存在しなければ新規作成) */
async function uploadContentToDrive(filename, mimeType, content, cacheKey) {
  const folderId = await getOrCreateGdriveFolder();
  const existingId = await findExistingFileIdByName(folderId, filename, cacheKey);

  const metadata = existingId ? {} : { name: filename, parents: [folderId] };
  const boundary = "pvboundary" + Date.now();
  const body =
    `--${boundary}\r\n` +
    `Content-Type: application/json; charset=UTF-8\r\n\r\n` +
    JSON.stringify(metadata) + `\r\n` +
    `--${boundary}\r\n` +
    `Content-Type: ${mimeType}\r\n\r\n` +
    content + `\r\n` +
    `--${boundary}--`;

  const url = existingId
    ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart&fields=id,modifiedTime`
    : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,modifiedTime";

  const uploadRes = await gdriveFetch(url, {
    method: existingId ? "PATCH" : "POST",
    headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
    body,
  });
  if (!uploadRes.ok) throw new Error("upload failed: " + uploadRes.status);
  const json = await uploadRes.json();
  if (!existingId && cacheKey) localStorage.setItem(cacheKey, json.id);
  return json.modifiedTime;
}

const GDRIVE_KNOWN_MODIFIED_KEY = "pv_gdrive_known_modified_time";

/* 保存を1件ずつ順番に行うためのキュー。並行して複数走らせると、通信の
   到着順が前後して古い内容が新しい内容を上書きしてしまうことがあるため、
   手動保存・自動保存を問わず必ず前の保存が終わってから次を始める。 */
let gdriveSyncQueue = Promise.resolve();
function uploadBackupToDrive() {
  const task = gdriveSyncQueue.then(async () => {
    if (state.vault && state.vault.sites.length === 0 && (await gdriveBackupHasData())) {
      const proceed = confirm("Googleドライブには登録済みのデータがありますが、この端末のデータは空です。\n\nこのままGoogleドライブのバックアップも空にしてよろしいですか？");
      if (!proceed) {
        const err = new Error("sync-cancelled");
        err.code = "sync-cancelled";
        throw err;
      }
    }
    const store = loadStore();
    const payload = JSON.stringify({ app: "passvault", version: 1, ...store }, null, 2);
    const modifiedTime = await uploadContentToDrive(GDRIVE_BACKUP_FILENAME, "application/json", payload, GDRIVE_FILE_ID_KEY);
    if (modifiedTime) localStorage.setItem(GDRIVE_KNOWN_MODIFIED_KEY, modifiedTime);
  });
  gdriveSyncQueue = task.catch(() => {});
  return task;
}

/* 今この端末が空っぽの状態でGoogleドライブに保存しようとした時、
   すでにGoogleドライブ側に中身があるかどうかを確認するためだけの軽い問い合わせ */
async function gdriveBackupHasData() {
  try {
    const { backupStore } = await downloadBackupFromDrive();
    const vault = await decryptObj(state.key, backupStore.iv, backupStore.data);
    return !!(vault && vault.sites && vault.sites.length > 0);
  } catch (e) {
    return false;
  }
}

async function saveToGoogleDrive() {
  if (!(await ensureGdriveAccessToken())) { offerGdriveReconnect(); return; }
  try {
    showToast("Googleにサインインしています…");
    await uploadBackupToDrive();
    localStorage.setItem(GDRIVE_AUTOSYNC_KEY, "1");
    const toggle = document.getElementById("autosyncToggle");
    if (toggle) toggle.checked = true;
    showToast("Googleドライブに保存しました");
  } catch (e) {
    if (e.code === "sync-cancelled") {
      showToast("キャンセルしました");
      return;
    }
    if (e.code === "gdrive-auth-required") {
      offerGdriveReconnect();
      return;
    }
    console.error(e);
    alert("Googleドライブへの保存に失敗しました。\n\nもう一度お試しください。");
  }
}

/* 他の端末でGoogleドライブに保存したバックアップを取り込む(端末間で同じデータを見られるようにする) */
async function downloadBackupFromDrive() {
  const folderId = await getOrCreateGdriveFolder();
  const fileId = await findExistingFileIdByName(folderId, GDRIVE_BACKUP_FILENAME, GDRIVE_FILE_ID_KEY);
  if (!fileId) {
    const err = new Error("no-backup-found");
    err.code = "no-backup-found";
    throw err;
  }
  const metaRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`);
  const meta = metaRes.ok ? await metaRes.json() : {};
  const res = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  if (!res.ok) throw new Error("download failed: " + res.status);
  const obj = await res.json();
  if (!obj.salt || !obj.iv || !obj.data || !obj.iterations) {
    const err = new Error("invalid-backup");
    err.code = "invalid-backup";
    throw err;
  }
  return { backupStore: obj, modifiedTime: meta.modifiedTime };
}

async function restoreFromGoogleDrive() {
  if (!(await ensureGdriveAccessToken())) { offerGdriveReconnect(); return; }
  try {
    showToast("Googleドライブから確認しています…");
    const { backupStore } = await downloadBackupFromDrive();
    openRestorePasswordSheet(backupStore);
  } catch (e) {
    if (e.code === "gdrive-auth-required") {
      offerGdriveReconnect();
      return;
    }
    console.error(e);
    if (e.code === "no-backup-found") {
      alert("Googleドライブにバックアップが見つかりませんでした。\n\n先に別の端末で「Googleドライブに保存」を行ってください。");
    } else {
      alert("Googleドライブからの読み込みに失敗しました。\n\nもう一度お試しください。");
    }
  }
}

/* ========================= 端末間同期(リロード・ロック解除時) ========================= */
/* アプリを開き直す(リロードする・ロック解除する)たびに、Googleドライブ側が更新されていれば裏で取り込む。
   同じマスターパスワード(=同じsalt)でセットアップした端末同士でのみ復号に成功する。 */

async function checkAndPullFromDrive() {
  if (localStorage.getItem(GDRIVE_AUTOSYNC_KEY) !== "1") return false;
  if (!state.key || !state.vault) return false;
  try {
    const folderId = await getOrCreateGdriveFolder();
    const fileId = await findExistingFileIdByName(folderId, GDRIVE_BACKUP_FILENAME, GDRIVE_FILE_ID_KEY);
    if (!fileId) return false;

    const metaRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?fields=modifiedTime`);
    if (!metaRes.ok) return false;
    const meta = await metaRes.json();
    if (localStorage.getItem(GDRIVE_KNOWN_MODIFIED_KEY) === meta.modifiedTime) return false; // 変化なし

    // この端末に既にアカウントが登録されている場合、Googleドライブの内容で無条件に
    // 上書きすると、同期が途中で止まった時などにこの端末のデータが消えてしまう恐れがある。
    // そのため自動での取り込みは、この端末が空っぽ(新しい端末で初めて受け取る場合)の時だけに限る。
    // それ以外は設定画面の「Googleドライブから復元する」で本人の意思で明示的に行ってもらう。
    if (state.vault.sites.length > 0) return false;

    const contentRes = await gdriveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
    if (!contentRes.ok) return false;
    const backupStore = await contentRes.json();
    const vault = await decryptObj(state.key, backupStore.iv, backupStore.data); // saltが同じ端末同士なら復号できる

    state.vault = normalizeVault(vault);
    const store = loadStore();
    store.iv = backupStore.iv;
    store.data = backupStore.data;
    saveStore(store);
    localStorage.setItem(GDRIVE_KNOWN_MODIFIED_KEY, meta.modifiedTime);
    return true;
  } catch (e) {
    // saltが違う(=別々にセットアップした端末)場合はここで静かに失敗する。異常ではないので握りつぶす。
    return false;
  }
}

async function autoPullAndRefresh() {
  const changed = await checkAndPullFromDrive();
  if (changed && state.key) {
    state.openSiteId = null;
    renderPartialList();
    showToast("他の端末の変更を取り込みました");
  }
}

/* アカウントの追加・編集・削除のたびに自動で呼ばれる(接続済みの場合のみ) */
async function autoSyncToGoogleDrive() {
  if (localStorage.getItem(GDRIVE_AUTOSYNC_KEY) !== "1") return;
  if (!(await ensureGdriveAccessToken())) { offerGdriveReconnect(); return; }
  try {
    await uploadBackupToDrive();
  } catch (e) {
    if (e.code === "sync-cancelled") return; // ユーザーが上書きを拒否しただけなので失敗扱いにしない
    if (e.code === "gdrive-auth-required") {
      offerGdriveReconnect();
      return;
    }
    console.error(e);
    showToast("Googleドライブへの自動保存に失敗しました");
  }
}

function loadOpenFolderIds() {
  try {
    const raw = localStorage.getItem(OPEN_FOLDERS_KEY);
    return new Set(raw ? JSON.parse(raw) : []);
  } catch (e) {
    return new Set();
  }
}
function saveOpenFolderIds() {
  localStorage.setItem(OPEN_FOLDERS_KEY, JSON.stringify([...state.openFolderIds]));
}

  key: null,          // CryptoKey (メモリ上のみ)
  vault: null,         // {sites: [...], folders: [...]}
  openSiteId: null,
  openFolderIds: loadOpenFolderIds(), // 開いた状態のフォルダid一覧(端末に保存、アプリを閉じても保持)
  search: "",
  maskState: new Map(), // フィールドid -> 現在マスク中かどうか(未設定時はf.secretに従う)
};
let idleTimer = null;

function isMasked(field) {
  return state.maskState.has(field.id) ? state.maskState.get(field.id) : !!field.secret;
}

/* 古いバックアップ/端末には folders が無いことがあるので、読み込むたびに補完する */
function normalizeVault(vault) {
  if (!vault.folders) vault.folders = [];
  return vault;
}

function uid() {
  return crypto.randomUUID ? crypto.randomUUID() : "id-" + Math.random().toString(36).slice(2) + Date.now();
}
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* ========================= 自動ロック ========================= */
const IDLE_MS = 5 * 60 * 1000;
function resetIdleTimer() {
  if (!state.key) return;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(lockVault, IDLE_MS);
}
["click", "touchstart", "keydown", "scroll"].forEach((ev) =>
  document.addEventListener(ev, resetIdleTimer, { passive: true })
);

function lockVault() {
  state.key = null;
  state.vault = null;
  state.openSiteId = null;
  state.maskState.clear();
  clearTimeout(idleTimer);
  clearSessionKeyCache();
  render();
}

/* ========================= 保存 ========================= */
async function saveVaultLocal() {
  const store = loadStore();
  const enc2 = await encryptObj(state.key, state.vault);
  store.iv = enc2.iv;
  store.data = enc2.data;
  saveStore(store);
}

async function persistVault() {
  await saveVaultLocal();
  autoSyncToGoogleDrive(); // 接続済みなら裏で自動アップロード(完了を待たない)
}

/* ========================= トースト ========================= */
let toastTimer = null;
function showToast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("show"), 1400);
}

async function copyText(text, label) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
  }
  showToast((label ? label + "を" : "") + "コピーしました");
}

function bindSetup() {

    errEl.textContent = "";

    const saltB64 = toB64(saltBytes);
    const key = await deriveKey(pw1, saltB64, ITERATIONS);
    const vault = { sites: [], folders: [] };
    const { iv, data } = await encryptObj(key, vault);
    saveStore({ salt: saltB64, iterations: ITERATIONS, iv, data });

    state.key = key;
    state.vault = vault;
    resetIdleTimer();
    cacheKeyForSession(key);
    render();
  });
  document.getElementById("takeOverBtn").addEventListener("click", openTakeOverSheet);
}

/* 2台目以降の端末用: Googleドライブの既存バックアップと同じsalt(暗号化の鍵の元)をそのまま引き継ぐことで、
   1台目と全く同じマスターパスワードで開けるようにする */
function openTakeOverSheet() {
  const overlay = getOverlay();
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-handle"></div>
      <div class="sheet-title">Googleドライブから引き継ぐ</div>
      <div class="settings-note" style="margin-top:-4px;">
        別の端末で使っているマスターパスワードを入力してください。Googleドライブ上のデータを確認し、同じパスワードでこの端末からも開けるようにします。
      </div>
      <div class="sfield">
        <label>マスターパスワード(別の端末と同じもの)</label>
        <input type="password" id="takeOverPw" inputmode="numeric" autocomplete="off" />
      </div>
      <div class="error-msg" id="takeOverError"></div>
      <div class="btn-row">
        <button class="btn secondary" id="cancelTakeOverBtn">キャンセル</button>
        <button class="btn" id="confirmTakeOverBtn">引き継ぐ</button>
      </div>
    </div>`;
  showOverlay();

  document.getElementById("cancelTakeOverBtn").addEventListener("click", closeOverlay);
  document.getElementById("confirmTakeOverBtn").addEventListener("click", async () => {
    const pw = document.getElementById("takeOverPw").value;
    const errEl = document.getElementById("takeOverError");
    errEl.textContent = "";
    try {
      showToast("Googleドライブを確認しています…");
      const { backupStore, modifiedTime } = await downloadBackupFromDrive();
      const key = await deriveKey(pw, backupStore.salt, backupStore.iterations);
      const vault = await decryptObj(key, backupStore.iv, backupStore.data);

      saveStore(backupStore);
      state.key = key;
      state.vault = normalizeVault(vault);
      if (modifiedTime) localStorage.setItem(GDRIVE_KNOWN_MODIFIED_KEY, modifiedTime);
      localStorage.setItem(GDRIVE_AUTOSYNC_KEY, "1");
      resetIdleTimer();
      cacheKeyForSession(key);
      closeOverlay();
      render();
    } catch (e) {
      console.error(e);
      if (e.code === "no-backup-found") {
        errEl.textContent = "Googleドライブにバックアップが見つかりませんでした";
      } else {
        errEl.textContent = "パスワードが違うか、読み込みに失敗しました";
      }
    }
  });
}

/* ========================= 画面: メイン ========================= */
function normalizeForSearch(s) {
  return String(s ?? "").normalize("NFKC").toLowerCase();
}

function filteredSites() {
  const q = normalizeForSearch(state.search.trim());
  if (!q) return state.vault.sites;
  return state.vault.sites.filter((s) => normalizeForSearch(s.name).includes(q));
}

function buildListHtml() {
  const q = state.search.trim();
  if (q) {
    const sites = filteredSites();
    return sites.length
      ? sites.map(renderSiteCard).join("")
      : `<div class="empty-state">一致するアカウントがありません</div>`;
  }
  if (!state.vault.sites.length && !state.vault.folders.length) {
    return `<div class="empty-state">まだ何も登録されていません。<br>下の [+ NEW ACCOUNT] から追加しましょう。</div>`;
  }
  if (!state.vault.folders.length) {
    return state.vault.sites.map(renderSiteCard).join("");
  }
  return renderFolderGroups();
}

function renderFolderGroups() {
  const groups = state.vault.folders.map((folder) => ({
    folder,
    sites: state.vault.sites.filter((s) => s.folderId === folder.id),
  }));
  const validFolderIds = new Set(state.vault.folders.map((f) => f.id));
  const unassigned = state.vault.sites.filter((s) => !s.folderId || !validFolderIds.has(s.folderId));
  const foldersHtml = groups.map(renderFolderCard).join("");
  const unassignedHtml = unassigned.map(renderSiteCard).join(""); // フォルダに入れていないアカウントは、そのまま一覧に出す(未分類フォルダは作らない)
  return foldersHtml + unassignedHtml;
}

/* ========================= 背景の流れるコード(CodeVault) ========================= */
let rainPulseSeq = 0;
function pulseRain() {
  const rw = document.getElementById("rainWrap");
  if (!rw) return;
  rainPulseSeq++;
  const seq = rainPulseSeq;
  rw.classList.remove("active", "flash");
  rw.classList.add("resetting");
  setTimeout(() => {
    if (rainPulseSeq !== seq) return; // その間に別の操作があれば古い方は反映しない
    rw.classList.remove("resetting");
    rw.classList.add("flash"); // 1回だけ流れて、マスごとに自然に消える(モックアップと同じ)
  }, 60);
}
function setRainActive(on) {
  const rw = document.getElementById("rainWrap");
  if (!rw) return;
  rainPulseSeq++; // 進行中のpulseRainのタイムアウトを無効化する
  rw.classList.remove("resetting", "flash");
  rw.classList.toggle("active", on);
}

  const SCALE = 1; // モックアップと同じ実寸(10px文字・9pxマス)
  const CH = "ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789:.=*+-<>¥?!)(";
  const rnd = () => CH[Math.floor(Math.random() * CH.length)];
  const vw = Math.min(window.innerWidth, 480);
  const need = Math.ceil(window.innerHeight / (9 * SCALE)) + 2;
  const lit = COLS.map((col) => {
    const x = Math.round(col[0] * vw / 390), p = col[1], cells = col.slice(2);
    const extra = Math.max(0, need - cells.length);
    let t = 0, html = "";
    for (let i = 0; i < extra; i++) {
      const br = Math.random() < 0.5 ? "br" : "md";
      const flip = Math.random() < 0.5 ? ' style="transform:scaleX(-1);"' : "";
      html += `<div class="gcell"${flip}><span class="gc1 pp${p}_${br}" style="animation-delay:${t.toFixed(3)}s;">${rnd()}</span></div>`;
      t += 0.03 + Math.random() * 0.08;
    }
    cells.forEach((c) => {
      const flip = c[0] ? ' style="transform:scaleX(-1);"' : "";
      const d = (c[2] + t).toFixed(3);
      html += `<div class="gcell"${flip}><span class="gc1 pp${p}_${c[1]}" style="animation-delay:${d}s;">${c[3]}</span></div>`;
    });
    return `<div class="rcol2" style="left:${x}px;height:${(extra + cells.length) * 9}px;">${html}</div>`;
  });
  // モックの6列に加えて、同じ動きの列を6本足して倍の密度にする(位置・速さ・タイミングはバラバラ)
  const extraSpecs = [[15, "C", 2.6], [108, "A", 3.4], [185, "B", 1.1], [270, "A", 4.3], [300, "B", 0.6], [345, "C", 3.0]];
  const extra = extraSpecs.map(([bx, p, off]) => {
    const x = Math.round(bx * vw / 390);
    let t = off, html = "";
    for (let i = 0; i < need; i++) {
      const br = Math.random() < 0.5 ? "br" : "md";
      const flip = Math.random() < 0.5 ? ' style="transform:scaleX(-1);"' : "";
      html += `<div class="gcell"${flip}><span class="gc1 pp${p}_${br}" style="animation-delay:${t.toFixed(3)}s;">${rnd()}</span></div>`;
      t += 0.03 + Math.random() * 0.08;
    }
    return `<div class="rcol2" style="left:${x}px;height:${need * 9}px;">${html}</div>`;
  });
  return lit.concat(extra).join("");
}

/* コーナーブラケット装飾(4隅の小さいL字)。承認済みモックアップの実寸(7px/1.4px/3px)をそのままトレース */
function cvCorners(color) {
  const st = color ? ` style="border-color:${color}"` : "";
  return `<span class="cvc tl"${st}></span><span class="cvc tr"${st}></span><span class="cvc bl"${st}></span><span class="cvc br"${st}></span>`;
}
/* サブ画面共通ヘッダー(戻る矢印+タイトル)。モックアップの各サブ画面ヘッダーをトレース */
function sheetHead2(title, backBtnId) {
  return `<div class="sheet-head2"><button type="button" class="back-btn" id="${backBtnId}" aria-label="戻る">${ICONS.chevBack}</button><h3>${title}</h3></div>`;
}
/* 警告ボックス(赤/緑の三角アイコン+文章)。モックアップの各種確認画面をトレース */
function warnBox(text, dim) {
  return `<div class="warn-box${dim ? " dim" : ""}">${cvCorners(dim ? "#008F11" : "#ff3b3b")}${ICONS.warnTri}<div>${text}</div></div>`;
}

/* 確認画面(モックアップの警告ボックス+CANCEL/実行ボタン)。標準のconfirm()の代わりに使う。OK=true / キャンセル=false */
function confirmSheet({ title, html, confirmLabel, danger, backTo, keepOpen }) {
  return new Promise((resolve) => {
    const overlay = getOverlay();
    overlay.innerHTML = `
      <div class="sheet">
        ${sheetHead2(title, "csBack")}
        ${warnBox(html)}
        <div class="btn-row">
          <button class="btn secondary" id="csCancel">[&nbsp;CANCEL&nbsp;]</button>
          <button class="btn${danger ? " danger" : ""}" id="csOk">[&nbsp;${confirmLabel}&nbsp;]</button>
        </div>
      </div>`;
    showOverlay();
    const done = (v) => { if (!v) { resolve(v); if (backTo) backTo(); else closeOverlay(); return; } if (keepOpen) { resolve(v); return; } closeOverlay(); resolve(v); };
    document.getElementById("csBack").addEventListener("click", () => done(false));
    document.getElementById("csCancel").addEventListener("click", () => done(false));
    document.getElementById("csOk").addEventListener("click", () => done(true));
  });
}

/* 実在するフォルダの中に開いているものがあるか(消えたフォルダの古い記録は数えない) */
function anyFolderOpen() {
  return state.vault.folders.some((f) => state.openFolderIds.has(f.id));
}

function renderFolderCard({ folder, sites }) {
  const isOpen = state.openFolderIds.has(folder.id);
  const iconKey = folder.icon && ICONS[folder.icon] ? folder.icon : "folder";
  const iconColor = FOLDER_ICON_COLORS[iconKey];
  const innerHtml = sites.length
    ? sites.map(renderSiteCard).join("")
    : `<div class="empty-state" style="padding:16px 0;">このフォルダは空です</div>`;
  const dimmed = anyFolderOpen() && !isOpen;
  const cv = isOpen ? "#00FF41" : "var(--accent-2)";
  const folderCardHtml = `
    <div class="folder-card ${isOpen ? "open" : ""}" data-folder="${folder.id}" style="--card-dim:${dimmed ? 0.7 : 1}; --card-scale:${dimmed ? 0.98 : 1};">
      ${cvCorners()}
      <div class="folder-head" data-toggle-folder="${folder.id}">
        <div class="badge-ring">${ICONS[iconKey]}</div>
        <div class="folder-name-wrap">
          <div class="folder-name">${escapeHtml(folder.name)}</div>
          <div class="site-sub">${sites.length} ${sites.length === 1 ? "ACCOUNT" : "ACCOUNTS"}</div>
        </div>
        <button class="icon-edit-btn" data-rename-folder="${folder.id}" aria-label="フォルダ名を変更">${ICONS.pencil}</button>
        <div class="chevron-icon">${ICONS.chevRight}</div>
      </div>
      <div class="folder-body"><div class="fb-inner"><div class="fb-pad">${innerHtml}</div></div></div>
    </div>`;

  return `
  <div class="swipe-row" data-swipe-row>
    <div class="swipe-actions">
      <button class="swipe-action-btn delete" data-delete-folder="${folder.id}">削除</button>
    </div>
    <div class="swipe-fg">${folderCardHtml}</div>
  </div>`;
}

function renderSiteCard(site) {
  const isOpen = state.openSiteId === site.id;
  const dimmed = !!state.openSiteId && !isOpen;
  const cv = isOpen ? "#00FF41" : "var(--accent-2)";
  const sub = site.entries[0] ? escapeHtml(site.entries[0].value) : "";
  const fieldsHtml = site.entries.map((f) => {
    const masked = isMasked(f);
    const displayVal = masked ? "••••••••" : escapeHtml(f.value);
    return `
      <div class="field-row" data-copy="${f.id}">
        <div class="ftext">
          <div class="flabel">${escapeHtml(f.label)}</div>
          <div class="fvalue">${displayVal || "&nbsp;"}</div>
        </div>
        <span class="feye" data-toggle="${f.id}">${masked ? ICONS.eyeClosed : ICONS.eyeOpen}</span>
        <span class="fcopy">${ICONS.copy}</span>
      </div>`;
  }).join("");

  const memoHtml = site.memo ? `<div class="memo-box">${escapeHtml(site.memo)}</div>` : "";

  return `
  <div class="swipe-row" data-swipe-row>
    <div class="swipe-actions">
      <button class="swipe-action-btn delete" data-delete="${site.id}">削除</button>
    </div>
    <div class="swipe-fg">
      <div class="site-card ${isOpen ? "open" : ""}" data-site="${site.id}" style="--card-dim:${dimmed ? 0.7 : 1}; --card-scale:${dimmed ? 0.98 : 1};">
        ${cvCorners()}
        <div class="site-head" data-toggle-site="${site.id}">
          <div class="badge-ring">${ICONS.keyGeneric}</div>
          <div class="site-name-wrap">
            <div class="site-name">${escapeHtml(site.name)}</div>
            ${sub ? `<div class="site-sub">${sub}</div>` : ""}
          </div>
          <button class="icon-edit-btn" data-edit="${site.id}" aria-label="編集">${ICONS.pencil}</button>
          <div class="chevron-icon">${ICONS.chevDown}</div>
        </div>
        <div class="site-body"><div class="sb-inner"><div class="sb-pad">
          ${fieldsHtml}
          ${memoHtml}
        </div></div></div>
      </div>
    </div>
  </div>`;
}

/* 開閉・暗くする効果を、要素を作り直さずにクラスの付け替えだけで反映する */
function applyOpenState() {
  const anyOpen = anyFolderOpen();
  document.querySelectorAll(".folder-card[data-folder]").forEach((el) => {
    const open = state.openFolderIds.has(el.getAttribute("data-folder"));
    el.classList.toggle("open", open);
    const dim = anyOpen && !open;
    el.style.setProperty("--card-dim", dim ? 0.7 : 1);
    el.style.setProperty("--card-scale", dim ? 0.98 : 1);
  });
  document.querySelectorAll(".site-card[data-site]").forEach((el) => {
    const open = state.openSiteId === el.getAttribute("data-site");
    el.classList.toggle("open", open);
    const dim = !!state.openSiteId && !open;
    el.style.setProperty("--card-dim", dim ? 0.7 : 1);
    el.style.setProperty("--card-scale", dim ? 0.98 : 1);
  });
}

function renderPartialList() {
  const main = document.querySelector("main.content");
  if (!main) return;
  main.innerHTML = buildListHtml();
  bindListEvents();
}

function bindListEvents() {
  document.querySelectorAll("[data-toggle-folder]").forEach((el) => {
    el.addEventListener("click", () => {
      const row = el.closest("[data-swipe-row]");
      if (row && row.dataset.justSwiped === "1") return; // スワイプ操作の直後は開閉させない
      const id = el.getAttribute("data-toggle-folder");
      if (state.openFolderIds.has(id)) state.openFolderIds.delete(id);
      else state.openFolderIds.add(id);
      saveOpenFolderIds();
      pulseRain();
      applyOpenState(); // 作り直さずその場で開閉する(アニメーションを滑らかに見せるため)
    });
  });
  document.querySelectorAll("[data-toggle-site]").forEach((el) => {
    el.addEventListener("click", () => {
      const row = el.closest("[data-swipe-row]");
      if (row && row.dataset.justSwiped === "1") return; // スワイプ操作の直後は開閉させない
      const id = el.getAttribute("data-toggle-site");
      state.openSiteId = state.openSiteId === id ? null : id;
      if (state.openSiteId) setRainActive(true); else pulseRain();
      applyOpenState();
    });
  });
  document.querySelectorAll("[data-toggle]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-toggle");
      const site = state.vault.sites.find((s) => s.entries.some((f) => f.id === id));
      const field = site && site.entries.find((f) => f.id === id);
      if (!field) return;
      state.maskState.set(id, !isMasked(field));
      renderPartialList();
    });
  });
  document.querySelectorAll("[data-copy]").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-toggle]")) return;
      const fieldId = el.getAttribute("data-copy");
      const site = state.vault.sites.find((s) => s.entries.some((f) => f.id === fieldId));
      const field = site && site.entries.find((f) => f.id === fieldId);
      if (field) copyText(field.value, field.label);
    });
  });
  document.querySelectorAll("[data-edit]").forEach((el) => {
    el.addEventListener("click", (e) => {
      e.stopPropagation();
      openSiteSheet(el.getAttribute("data-edit"));
    });
  });
  document.querySelectorAll("[data-delete]").forEach((el) => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = el.getAttribute("data-delete");
      const site = state.vault.sites.find((s) => s.id === id);
      if (!site) return;

/* 左スワイプで削除ボタンを出す/長押しして上下に動かすと並び替えできる操作(アカウント行・フォルダ行共通) */
const LONG_PRESS_MS = 450;
const MOVE_THRESHOLD = 8;

function closeOtherSwipes(exceptRow) {
  document.querySelectorAll("[data-swipe-row]").forEach((row) => {
    if (row === exceptRow) return;
    const fg = row.querySelector(".swipe-fg");
    if (fg) {
      fg.style.transition = "transform .2s ease";
      fg.style.transform = "translateX(0px)";
    }
  });
}

function markJustInteracted(row) {
  row.dataset.justSwiped = "1";
  setTimeout(() => { row.dataset.justSwiped = ""; }, 260);
}

function commitReorder(parent, row) {
  const rows = [...parent.children].filter((el) => el.matches("[data-swipe-row]"));
  const isFolderRow = row.querySelector("[data-toggle-folder]") !== null;
  if (isFolderRow) {
    const newOrderIds = rows.map((r) => r.querySelector("[data-toggle-folder]").getAttribute("data-toggle-folder"));
    const idToFolder = new Map(state.vault.folders.map((f) => [f.id, f]));
    state.vault.folders = newOrderIds.map((id) => idToFolder.get(id)).filter(Boolean);
  } else {
    const newOrderIds = rows.map((r) => r.querySelector("[data-toggle-site]").getAttribute("data-toggle-site"));
    const memberSet = new Set(newOrderIds);
    const idToSite = new Map(state.vault.sites.map((s) => [s.id, s]));
    let ptr = 0;
    state.vault.sites = state.vault.sites.map((s) => (memberSet.has(s.id) ? idToSite.get(newOrderIds[ptr++]) : s));
  }
  persistVault().catch(() => {});
  renderPartialList();
}

function startReorderDrag(row, head, pointerId, startClientY) {
  const parent = row.parentElement;
  const rect = row.getBoundingClientRect();
  const grabOffsetY = startClientY - rect.top;

  const placeholder = document.createElement("div");
  placeholder.className = "reorder-placeholder";
  placeholder.style.height = rect.height + "px";
  parent.insertBefore(placeholder, row.nextSibling);

  row.classList.add("dragging");
  row.style.position = "fixed";
  row.style.left = rect.left + "px";
  row.style.top = rect.top + "px";
  row.style.width = rect.width + "px";
  row.style.zIndex = "50";
  if (navigator.vibrate) { try { navigator.vibrate(8); } catch (e) { /* 非対応端末では何もしない */ } }
  head.setPointerCapture(pointerId);

  const onMove = (e) => {
    const newTop = e.clientY - grabOffsetY;
    row.style.top = newTop + "px";
    const dragCenter = newTop + rect.height / 2;
    const children = [...parent.children];
    const placeholderIndex = children.indexOf(placeholder);
    const siblings = children.filter((el) => el !== row && el !== placeholder && el.matches("[data-swipe-row]"));
    for (const sib of siblings) {
      const sibIndex = children.indexOf(sib);
      const sibRect = sib.getBoundingClientRect();
      const sibCenter = sibRect.top + sibRect.height / 2;
      if (sibIndex > placeholderIndex && dragCenter > sibCenter) {
        parent.insertBefore(placeholder, sib.nextSibling);
        break;
      } else if (sibIndex < placeholderIndex && dragCenter < sibCenter) {
        parent.insertBefore(placeholder, sib);
        break;
      }
    }
  };
  const onEnd = () => {
    head.removeEventListener("pointermove", onMove);
    head.removeEventListener("pointerup", onEnd);
    head.removeEventListener("pointercancel", onEnd);
    row.classList.remove("dragging");
    row.style.position = "";
    row.style.left = "";
    row.style.top = "";
    row.style.width = "";
    row.style.zIndex = "";
    parent.insertBefore(row, placeholder);
    placeholder.remove();
    markJustInteracted(row);
    commitReorder(parent, row);
  };
  head.addEventListener("pointermove", onMove);
  head.addEventListener("pointerup", onEnd);
  head.addEventListener("pointercancel", onEnd);
}

function bindRowGestures() {
  document.querySelectorAll("[data-swipe-row]").forEach((row) => {
    const fg = row.querySelector(".swipe-fg");
    const actions = row.querySelector(".swipe-actions");
    const head = row.querySelector(".site-head, .folder-head");
    if (!fg || !actions || !head) return;
    const actionsWidth = actions.offsetWidth;
    let startX = 0, startY = 0, startTranslate = 0;
    let mode = "idle"; // idle | pending | swipe | reorder
    let longPressTimer = null;

    const getTranslate = () => {
      const match = fg.style.transform.match(/translateX\((-?\d+(?:\.\d+)?)px\)/);
      return match ? parseFloat(match[1]) : 0;
    };
    const clearLongPress = () => { clearTimeout(longPressTimer); longPressTimer = null; };

    head.addEventListener("pointerdown", (e) => {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      startX = e.clientX;
      startY = e.clientY;
      startTranslate = getTranslate();
      mode = "pending";
      longPressTimer = setTimeout(() => {
        if (mode !== "pending") return;
        mode = "reorder";
        closeOtherSwipes(row);
        startReorderDrag(row, head, e.pointerId, e.clientY);
      }, LONG_PRESS_MS);
    });
    head.addEventListener("pointermove", (e) => {
      if (mode !== "pending" && mode !== "swipe") return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      if (mode === "pending") {
        if (Math.abs(dx) < MOVE_THRESHOLD && Math.abs(dy) < MOVE_THRESHOLD) return;
        clearLongPress();
        if (Math.abs(dy) > Math.abs(dx)) { mode = "idle"; return; } // 縦の動きは画面スクロールに任せる
        mode = "swipe";
        closeOtherSwipes(row);
        head.setPointerCapture(e.pointerId);
        fg.style.transition = "none";
      }
      const next = Math.max(-actionsWidth, Math.min(0, startTranslate + dx));
      fg.style.transform = `translateX(${next}px)`;
    });
    const endGesture = () => {
      clearLongPress();
      if (mode === "swipe") {
        fg.style.transition = "transform .2s ease";
        const current = getTranslate();
        fg.style.transform = current < -actionsWidth / 2 ? `translateX(${-actionsWidth}px)` : "translateX(0px)";
        markJustInteracted(row);
      }
      mode = "idle";
    };
    head.addEventListener("pointerup", endGesture);
    head.addEventListener("pointercancel", endGesture);
  });
}

async function saveSiteFromSheet() {
  const name = document.getElementById("siteNameInput").value.trim();
  const memo = document.getElementById("siteMemoInput").value.trim();
  const folderInput = document.getElementById("siteFolderInput");
  const folderId = folderInput ? folderInput.value || null : null;
  if (!name) { alert("アカウント名を入力してください"); return; }
  const isDuplicateName = state.vault.sites.some((s) => s.name === name && s.id !== editingSiteId);
  if (isDuplicateName) {
    if (!confirm(`「${name}」という名前のアカウントは既に登録されています。\n\n本当に保存しますか？`)) return;
  }
  const SECRET_LABEL_RE = /パスワード|password|pass|pwd|pin|secret|暗証/i;
  const cleanFields = editingFields
    .filter((f) => f.label.trim() !== "" || f.value.trim() !== "")
    .map((f) => {
      const label = f.label.trim() || "項目";
      return { id: f.id, label, value: f.value, secret: SECRET_LABEL_RE.test(label) };
    });

  let previousSnapshot = null;
  if (editingSiteId) {
    const site = state.vault.sites.find((s) => s.id === editingSiteId);
    previousSnapshot = { name: site.name, memo: site.memo, entries: site.entries, folderId: site.folderId };
    site.name = name;
    site.memo = memo;
    site.entries = cleanFields;
    site.folderId = folderId;
  } else {
    state.vault.sites.push({ id: uid(), name, memo, entries: cleanFields, folderId });
  }
  try {
    await persistVault();
  } catch (e) {
    // 保存に失敗した場合、画面上のデータも保存前の状態に戻す(実際に保存された内容とズレないようにするため)
    if (previousSnapshot) {
      Object.assign(state.vault.sites.find((s) => s.id === editingSiteId), previousSnapshot);
    } else {
      state.vault.sites.pop();
    }
    return;
  }
  closeOverlay();
  renderPartialList();
}

function openSearchSheet() {
  const overlay = getOverlay();
  const renderResults = (query) => {
    const box = document.getElementById("searchResultsBox");
    if (!box) return;
    const raw = query.trim();
    const q = normalizeForSearch(raw);
    if (!q) { box.innerHTML = ""; return; }
    const sites = state.vault.sites.filter((s) => normalizeForSearch(s.name).includes(q));
    const hl = (name) => {
      const i = q ? normalizeForSearch(name).indexOf(q) : -1;
      if (i < 0 || normalizeForSearch(name).length !== name.length) return escapeHtml(name);
      return escapeHtml(name.slice(0, i)) + "<b>" + escapeHtml(name.slice(i, i + q.length)) + "</b>" + escapeHtml(name.slice(i + q.length));
    };
    const folderName = (s) => { const f = state.vault.folders.find((x) => x.id === s.folderId); return f ? f.name : ""; };
    box.innerHTML = `<div class="search-label">RESULTS (${sites.length})</div>` + (sites.length
      ? sites.map((s) => `
        <div class="search-card" data-search-result="${s.id}" data-folder-id="${s.folderId || ""}">
          ${cvCorners("#00FF41")}
          <div class="badge-ring">${ICONS.keyGeneric}</div>
          <div style="flex:1;min-width:0;"><div class="sname">${hl(s.name)}</div><div class="ssub">${escapeHtml(folderName(s))}</div></div>
        </div>`).join("")
      : `<div class="empty-state">一致するアカウントがありません</div>`);
    box.querySelectorAll("[data-search-result]").forEach((el) => {
      el.addEventListener("click", () => {
        const id = el.getAttribute("data-search-result");
        const folderId = el.getAttribute("data-folder-id");
        closeOverlay();
        if (folderId) { state.openFolderIds.add(folderId); saveOpenFolderIds(); }
        state.openSiteId = id;
        setRainActive(true);
        renderPartialList();
        setTimeout(() => {
          const target = document.querySelector(`[data-site="${id}"]`);
          if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
        }, 60);
      });
    });
  };
  overlay.innerHTML = `
    <div class="sheet">
      <div class="search-head">
        <button type="button" class="back-btn" id="closeSearchBtn" aria-label="戻る" style="background:none;border:none;padding:0;display:flex;color:var(--accent-2);">${ICONS.chevBack}</button>
        <div class="search-box">${ICONS.search}<input type="text" id="searchSheetInput" placeholder="SEARCH" autocomplete="off" /></div>
      </div>
      <div id="searchResultsBox"></div>
    </div>`;
  showOverlay();
  document.getElementById("closeSearchBtn").addEventListener("click", closeOverlay);
  const input = document.getElementById("searchSheetInput");
  input.addEventListener("input", (e) => renderResults(e.target.value));
  renderResults("");
  setTimeout(() => input.focus(), 260);
}

  overlay.innerHTML = `

        <h3>CHANGE PASSWORD</h3>

      </div>

        <input type="password" id="newPw1" inputmode="numeric" autocomplete="new-password" />
      </div>
      <div class="sfield">
        <label>CONFIRM NEW PASSWORD</label>
        <input type="password" id="newPw2" inputmode="numeric" autocomplete="new-password" />
      </div>
      <div class="error-msg" id="changePwError"></div>
      <div class="btn-row">
        <button class="btn secondary" id="cancelChangePw2">[&nbsp;CANCEL&nbsp;]</button>
        <button class="btn" id="confirmChangePw">[&nbsp;SAVE&nbsp;]</button>
      </div>
    </div>`;
  showOverlay();
  document.getElementById("cancelChangePw").addEventListener("click", openSettingsSheet);
  document.getElementById("cancelChangePw2").addEventListener("click", openSettingsSheet);
  document.getElementById("confirmChangePw").addEventListener("click", async () => {
    const cur = document.getElementById("curPw").value;
    const n1 = document.getElementById("newPw1").value;
    const n2 = document.getElementById("newPw2").value;
    const errEl = document.getElementById("changePwError");
    const store = loadStore();
    try {
      const curKey = await deriveKey(cur, store.salt, store.iterations);
      await decryptObj(curKey, store.iv, store.data);
    } catch (e) {
      errEl.textContent = "現在のパスワードが違います";
      return;
    }
    if (n1.length < 4) { errEl.textContent = "4文字以上のパスワードを入力してください"; return; }
    if (n1 !== n2) { errEl.textContent = "新しいパスワードが一致しません"; return; }

    const newSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
    const newKey = await deriveKey(n1, newSalt, ITERATIONS);
    const { iv, data } = await encryptObj(newKey, state.vault);
    saveStore({ salt: newSalt, iterations: ITERATIONS, iv, data });
    state.key = newKey;
    cacheKeyForSession(newKey);
    closeOverlay();
    showToast("マスターパスワードを変更しました");
  });
}

/* 共有シートで渡せればそちら経由、できなければダウンロードにフォールバック */
async function shareOrDownloadFile(blob, filename) {
  if (navigator.canShare && navigator.share) {
    const file = new File([blob], filename, { type: blob.type });
    if (navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: filename });
        return true;
      } catch (e) {
        if (e && e.name === "AbortError") return false;
        // 共有に失敗した場合は下のダウンロード方式にフォールバック
      }
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  return true;
}

async function exportBackup() {
  const store = loadStore();
  const payload = JSON.stringify({ app: "passvault", version: 1, ...store }, null, 2);
  const date = new Date().toISOString().slice(0, 10);
  const filename = `passvault-backup-${date}.json`;
  const blob = new Blob([payload], { type: "application/json" });
  const done = await shareOrDownloadFile(blob, filename);
  if (done) showToast("バックアップを書き出しました");
}

/* 他のパスワード管理アプリへの乗り換え用に、暗号化なしの読める形式で書き出す */
function buildPlainTextExport() {
  const lines = [];
  lines.push("Vaultly エクスポート（暗号化なし）");
  lines.push(`書き出し日時: ${new Date().toLocaleString("ja-JP")}`);
  lines.push("");
  state.vault.sites.forEach((site) => {
    lines.push(`■ ${site.name}`);
    site.entries.forEach((f) => lines.push(`${f.label}: ${f.value}`));
    if (site.memo) lines.push(`メモ: ${site.memo}`);
    lines.push("");
  });
  return lines.join("\n");
}

async function exportPlainText() {
  if (!state.vault.sites.length) {
    alert("書き出せるアカウントがありません");
    return;
  }
  const ok = await confirmSheet({ title: "EXPORT AS TEXT", danger: true, confirmLabel: "EXPORT", backTo: openSettingsSheet,
    html: "この書き出しファイルは、パスワードが暗号化されていない読める状態のテキストです。<br><br>他のパスワード管理アプリへ移行する時など、必要な場合だけご利用ください。書き出したファイルは、使い終わったら削除することをおすすめします。" });
  if (!ok) return;

  const text = buildPlainTextExport();
  const date = new Date().toISOString().slice(0, 10);
  const filename = `vaultly-export-plain-${date}.txt`;
  const blob = new Blob([text], { type: "text/plain" });
  const done = await shareOrDownloadFile(blob, filename);
  if (done) showToast("テキストで書き出しました");
}

/* テキスト(暗号化なし)をGoogleドライブに保存。PC・iPhoneどちらでも同じ手順で使える */
async function savePlainTextToGoogleDrive() {
  if (!state.vault.sites.length) {
    alert("書き出せるアカウントがありません");
    return;
  }
  const ok = await confirmSheet({ title: "SAVE TEXT TO DRIVE", danger: true, confirmLabel: "SAVE", backTo: openSettingsSheet,
    html: "Googleドライブに保存されるこのファイルは、パスワードが暗号化されていない読める状態のテキストです。<br><br>他のパスワード管理アプリへ移行する時など、必要な場合だけご利用ください。" });
  if (!ok) return;
  if (!(await ensureGdriveAccessToken())) { offerGdriveReconnect(); return; }

  try {
    showToast("Googleにサインインしています…");
    const text = buildPlainTextExport();
    await uploadContentToDrive(GDRIVE_PLAIN_FILENAME, "text/plain; charset=UTF-8", text, GDRIVE_PLAIN_FILE_ID_KEY);
    showToast("Googleドライブに保存しました");
  } catch (e) {
    if (e.code === "gdrive-auth-required") {
      offerGdriveReconnect();
      return;
    }
    console.error(e);
    alert("Googleドライブへの保存に失敗しました。\n\nもう一度お試しください。");
  }
}

/* ロック画面からの復元: マスターパスワードごとバックアップの内容に置き換える(端末移行・パスワード紛失時向け) */
function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.salt || !obj.iv || !obj.data || !obj.iterations) throw new Error("invalid");
      if (!(await confirmSheet({ title: "RECOVER FROM FILE", danger: true, confirmLabel: "RECOVER", html: "このバックアップで現在のデータを置き換えます。<br><br>よろしいですか？" }))) return;
      saveStore({ salt: obj.salt, iterations: obj.iterations, iv: obj.iv, data: obj.data });
      showToast("復元しました。ロック解除してください");
      lockVault();
    } catch (err) {
      alert("バックアップファイルを読み込めませんでした");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

/* 設定画面からの復元: 今のマスターパスワード・Googleドライブ連携はそのままに、アカウントの中身だけをバックアップの内容に置き換える */
function handleImportFileSettings(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const obj = JSON.parse(reader.result);
      if (!obj.salt || !obj.iv || !obj.data || !obj.iterations) throw new Error("invalid");
      openRestorePasswordSheet(obj);
    } catch (err) {
      alert("バックアップファイルを読み込めませんでした");
    }
  };
  reader.readAsText(file);
  e.target.value = "";
}

  overlay.innerHTML = `

        このバックアップファイルを作成した時のマスターパスワードを入力してください。今のマスターパスワードは変わらず、アカウントの中身だけがこのバックアップの内容に置き換わります。
      </div>
      <div class="sfield">
        <label>バックアップ作成時のマスターパスワード</label>
        <input type="password" id="restorePw" inputmode="numeric" autocomplete="off" />
      </div>
      <div class="error-msg" id="restoreError"></div>
      <div class="btn-row">
        <button class="btn secondary" id="cancelRestoreBtn">キャンセル</button>
        <button class="btn" id="confirmRestoreBtn">復元する</button>
      </div>
    </div>`;
  showOverlay();

  document.getElementById("cancelRestoreBtn").addEventListener("click", openSettingsSheet);
  document.getElementById("confirmRestoreBtn").addEventListener("click", async () => {

    const errEl = document.getElementById("restoreError");
    let importedVault;
    try {
      const backupKey = await deriveKey(pw, backupStore.salt, backupStore.iterations);
      importedVault = await decryptObj(backupKey, backupStore.iv, backupStore.data);
    } catch (e) {
      errEl.textContent = "パスワードが違います";
      return;
    }
    if (!(await confirmSheet({ title: "RECOVER", danger: true, confirmLabel: "RECOVER", backTo: openSettingsSheet, html: "現在のアカウントデータを、このバックアップの内容に置き換えます。<br><br>よろしいですか？" }))) return;
    state.vault = normalizeVault(importedVault);
    state.openSiteId = null;
    state.maskState.clear();
    await saveVaultLocal(); // 復元直後にGoogleドライブへ自動で上書き保存しない(誤ったバックアップでクラウド側を壊さないため)
    closeOverlay();
    showToast("復元しました");
    render();
  });
}

/* ========================= オーバーレイ共通 ========================= */
function getOverlay() {
  let overlay = document.getElementById("overlay");
  if (!overlay) {
    overlay = document.createElement("div");
    overlay.id = "overlay";
    overlay.className = "overlay";
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeOverlay(); });
    document.body.appendChild(overlay);
  }
  return overlay;
}
function showOverlay() {
  const overlay = getOverlay();
  document.body.classList.add("sub-open");
  requestAnimationFrame(() => overlay.classList.add("show"));
}
/* 画面の階層は固定: トップ画面(1) → 設定・検索・追加など(2) → 設定から開くパスワード変更・エクスポート・復元・削除確認など(3)。
   3の画面の戻る/キャンセルは設定画面(2)へ、2の画面の戻るはトップ画面(1)へ */
function closeOverlay() {
  const overlay = document.getElementById("overlay");
  if (overlay) overlay.classList.remove("show");
  document.body.classList.remove("sub-open");
}

/* ========================= ルート描画 ========================= */
function render() {
  const app = document.getElementById("app");
  closeOverlay();
  if (!state.key) {
    const store = loadStore();
    if (!store) {
      app.innerHTML = renderSetup();
      bindSetup();
    } else {
      app.innerHTML = renderUnlock();
      bindUnlock();
    }
  } else {
    app.innerHTML = renderMain();
    bindMain();
  }
}

(async () => {
  const returnedFromGoogle = await consumeGdriveRedirectToken();
  const unlocked = await tryAutoUnlock();
  if (unlocked) {
    resetIdleTimer();
    autoPullAndRefresh();
    if (returnedFromGoogle && localStorage.getItem(GDRIVE_RESUME_SYNC_KEY) === "1") {
      localStorage.removeItem(GDRIVE_RESUME_SYNC_KEY);
      localStorage.setItem(GDRIVE_AUTOSYNC_KEY, "1"); // Googleと再連携したので、以後の自動同期も有効にしておく
      showToast("Googleと再連携しました");
      autoSyncToGoogleDrive(); // 再連携前にやろうとしていた同期を、続けて行う
    }
  } else if (returnedFromGoogle) {
    localStorage.removeItem(GDRIVE_RESUME_SYNC_KEY);
  }
  render();
})();

/* ========================= Service Worker ========================= */
if ("serviceWorker" in navigator) {
  /* 新しいバージョンに切り替わった瞬間に自動で1回だけ再読み込みする
     (これがないと、リロードを2回しないと最新版に切り替わらない) */
  let swRefreshing = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (swRefreshing) return;
    swRefreshing = true;
    window.location.reload();
  });
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

/* ストレージ容量不足時の自動削除を避ける(手動でのSafariデータ消去は防げない) */
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}
